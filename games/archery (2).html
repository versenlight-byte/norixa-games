<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="description" content="좌우로 움직이는 과녁에 타이밍을 맞춰 화살을 쏘는 양궁 게임. 5발 도전.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-deep:#120A22; --card:#241640; --card-hi:#2E1B52;
    --ink:#F5F0EA; --muted:#A79BC4;
    --coral:#FF6B4A; --teal:#2DD4BF; --amber:#FFC24B; --purple:#8B7CF6;
    --line: rgba(245,240,234,0.10);
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    min-height:100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #35205C 0%, transparent 60%), var(--bg-deep);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    touch-action: none;
  }
  .wrap{ width:100%; max-width:400px; display:flex; flex-direction:column; gap:10px; }
  a.back{ color:var(--muted); text-decoration:none; font-size:13px; }
  header{ text-align:center; }
  h1{ font-family:'Do Hyeon', sans-serif; font-size:28px; margin:4px 0 0;
      background: linear-gradient(90deg, var(--coral), var(--amber));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ margin:4px 0 0; color:var(--muted); font-size:12.5px; }

  .ad-slot{
    width:100%; min-height:50px; border:1px dashed rgba(245,240,234,0.22);
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:rgba(245,240,234,0.35); font-size:11px; background:rgba(245,240,234,0.03);
  }

  .top-row{ display:flex; gap:8px; }
  .stat-box{ flex:1; text-align:center; padding:7px 4px; border-radius:12px; background: rgba(245,240,234,0.06); border:1px solid var(--line); }
  .stat-box .lbl{ font-size:10px; color:var(--muted); }
  .stat-box .val{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px; }

  .board-wrap{ position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
  #gameCanvas{ display:block; width:100%; height:auto; }

  .shoot-btn{
    border:none; cursor:pointer; border-radius:16px; padding:16px; width:100%;
    background: linear-gradient(135deg, var(--coral), var(--amber)); color:#1B1030;
    font-weight:900; font-size:18px; font-family:'Do Hyeon', sans-serif; letter-spacing:1px;
  }
  .shoot-btn:active{ transform: scale(0.97); }
  .shoot-btn:disabled{ opacity:0.4; }

  .newgame-btn{ border:none; cursor:pointer; border-radius:12px; padding:10px; width:100%;
    background: rgba(245,240,234,0.08); border:1px solid var(--line); color:var(--muted); font-size:12.5px; }

  .overlay{
    position:fixed; inset:0; background: rgba(10,6,20,0.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:340px; background: linear-gradient(180deg, var(--card-hi), var(--card));
    border-radius:22px; border:1px solid var(--line); padding:26px 22px 22px; text-align:center;
    transform: translateY(14px) scale(0.96); transition: transform .25s ease; box-shadow: var(--shadow);
  }
  .overlay.show .modal{ transform: translateY(0) scale(1); }
  .modal .emoji{ font-size:40px; margin-bottom:4px; }
  .modal h2{ font-family:'Do Hyeon', sans-serif; font-size:24px; margin:4px 0 10px; }
  .modal .result-line{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13px; margin-bottom:4px; }
  .btn-retry{ margin-top:18px; width:100%; padding:14px; border:none; cursor:pointer; border-radius:14px;
    background: linear-gradient(135deg, var(--teal), var(--amber)); color:#1B1030; font-weight:900; font-size:15px; font-family:'Noto Sans KR', sans-serif; }

  /* ---- shared juice layer (screen fx) ---- */
  @keyframes fxShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .fx-shake{ animation: fxShake .32s ease; }
  .fx-flash-el{ position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0; animation: fxFlashAnim .26s ease; }
  @keyframes fxFlashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }
  .fx-pop{ position:fixed; transform:translate(-50%,-50%); font-family:'JetBrains Mono',monospace; font-weight:900; pointer-events:none; z-index:9999; animation: fxPopAnim .75s ease forwards; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
  @keyframes fxPopAnim{ 0%{transform:translate(-50%,-50%) scale(0.5); opacity:0;} 18%{transform:translate(-50%,-65%) scale(1.2); opacity:1;} 100%{transform:translate(-50%,-160%) scale(1); opacity:0;} }
  button{ transition: transform .08s ease; }
  button:active{ transform:scale(0.93); }
  @media (prefers-reduced-motion: reduce){ .fx-shake, .fx-flash-el, .fx-pop{ animation:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← 게임 목록으로</a>
  <header>
    <h1>양궁 챌린지</h1>
    <p>움직이는 과녁에 타이밍을 맞춰 쏘세요 · 5발</p>
  </header>

  <ins class="adsbygoogle ad-slot"
       style="display:block"
       data-ad-client="ca-pub-4196209515730511"
       data-ad-slot="REPLACE_WITH_AD_SLOT_ID"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div class="top-row">
    <div class="stat-box"><div class="lbl">남은 화살</div><div class="val" id="arrowsLeft">5</div></div>
    <div class="stat-box"><div class="lbl">총점</div><div class="val" id="score">0</div></div>
    <div class="stat-box"><div class="lbl">최고 점수</div><div class="val" id="best">0</div></div>
  </div>

  <div class="board-wrap">
    <canvas id="gameCanvas" width="360" height="360"></canvas>
  </div>

  <button class="shoot-btn" id="shootBtn">발사!</button>
  <button class="newgame-btn" id="newGameBtn">새 게임 시작</button>

  <ins class="adsbygoogle ad-slot"
       style="display:block"
       data-ad-client="ca-pub-4196209515730511"
       data-ad-slot="REPLACE_WITH_AD_SLOT_ID"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div style="margin-top:4px;"><p style="text-align:center;color:var(--muted);font-size:12px;margin:0 0 8px;">🎮 다른 게임도 해보세요</p><div style="display:flex;gap:8px;flex-wrap:wrap;"><a href="omok.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">⚫<br><span style="font-size:11.5px;">오목</span></a><a href="click.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">⚡<br><span style="font-size:11.5px;">반응속도 테스트</span></a><a href="breakout.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">💥<br><span style="font-size:11.5px;">벽돌 깨기</span></a></div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="emoji" id="modalEmoji">🏹</div>
    <h2 id="modalTitle">결과 발표!</h2>
    <div class="result-line" id="modalScore">총점 0/50</div>
    <button class="btn-retry" id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '22px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const arrowsLeftEl = document.getElementById('arrowsLeft');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const shootBtn = document.getElementById('shootBtn');

  const RINGS = [
    { r:60, color:'#4b3a72', pts:4 },
    { r:42, color:'#8B7CF6', pts:5 },
    { r:26, color:'#FF6B4A', pts:8 },
    { r:12, color:'#FFC24B', pts:10 }
  ];

  let W, H, scale, targetX, targetY, dir, speed, score, arrows, aiming, animating, rafId, popup;

  function resize(){
    const wrapWidth = canvas.parentElement.clientWidth;
    scale = wrapWidth / 360;
    canvas.width = wrapWidth;
    canvas.height = wrapWidth;
    W = canvas.width; H = canvas.height;
    targetY = H * 0.34;
    if(targetX === undefined) targetX = W/2;
  }

  function loadBest(){ bestEl.textContent = localStorage.getItem('archery_best') || '0'; }

  function newGame(){
    score = 0; arrows = 5; dir = 1; speed = 90; popup = null;
    animating = false;
    targetX = 80;
    scoreEl.textContent = '0';
    arrowsLeftEl.textContent = arrows;
    overlay.classList.remove('show');
    shootBtn.disabled = false;
    loadBest();
    resize();
    cancelAnimationFrame(rafId);
    let last = performance.now();
    function tick(ts){
      const dt = Math.min((ts-last)/1000, 0.033);
      last = ts;
      if(!animating){
        targetX += dir * speed * scale * dt;
        const margin = 70*scale;
        if(targetX < margin){ targetX = margin; dir = 1; }
        if(targetX > W-margin){ targetX = W-margin; dir = -1; }
      }
      draw();
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }

  function draw(){
    ctx.fillStyle = '#1B1030';
    ctx.fillRect(0,0,W,H);

    // aim line
    ctx.strokeStyle = 'rgba(245,240,234,0.35)';
    ctx.setLineDash([6*scale,6*scale]);
    ctx.beginPath();
    ctx.moveTo(W/2, 0);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // target
    RINGS.forEach(ring => {
      ctx.beginPath();
      ctx.arc(targetX, targetY, ring.r*scale, 0, Math.PI*2);
      ctx.fillStyle = ring.color;
      ctx.fill();
    });

    // archer
    ctx.fillStyle = 'rgba(245,240,234,0.85)';
    ctx.beginPath();
    ctx.arc(W/2, H-30*scale, 10*scale, 0, Math.PI*2);
    ctx.fill();

    if(popup){
      ctx.fillStyle = popup.color;
      ctx.font = 'bold ' + (26*scale) + 'px "Do Hyeon", sans-serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = popup.alpha;
      ctx.fillText(popup.text, popup.x, popup.y);
      ctx.globalAlpha = 1;
    }
  }

  function computeScore(x){
    const dist = Math.abs(x - W/2) / scale;
    // 안쪽(고득점) 링부터 순서대로 확인해야 정중앙 명중이 제대로 10점으로 잡혀요.
    for(let i=RINGS.length-1; i>=0; i--){
      if(dist <= RINGS[i].r) return RINGS[i].pts;
    }
    return 0;
  }

  function shoot(){
    if(animating || arrows <= 0) return;
    SFX.click();
    animating = true;
    shootBtn.disabled = true;
    const hitX = targetX, hitY = targetY;
    const pts = computeScore(hitX);

    // 화살은 항상 가운데 조준선을 따라 '직선'으로 곧장 위로 날아가요.
    // 맞았는지 여부는 화살이 도착하는 순간 과녁이 그 자리에 있었는지로 결정돼요(타이밍 게임).
    const startX = W/2, startY = H-30*scale;
    const fixedX = W/2;
    const startTs = performance.now();
    const duration = 220;
    function anim(ts){
      const t = Math.min((ts-startTs)/duration, 1);
      const curX = fixedX;
      const curY = startY + (hitY-startY)*t;
      draw();
      ctx.strokeStyle = '#F5F0EA';
      ctx.lineWidth = 3*scale;
      ctx.beginPath();
      ctx.moveTo(curX, curY+14*scale);
      ctx.lineTo(curX, curY);
      ctx.stroke();
      if(t < 1){
        requestAnimationFrame(anim);
      } else {
        arrows--;
        score += pts;
        if(pts >= 8){ SFX.win(); FX.flash('rgba(255,194,75,0.32)'); FX.vibrate([35,30,70]); }
        else if(pts > 0){ SFX.correct(); FX.flash('rgba(45,212,191,0.22)'); FX.vibrate(14); }
        else { SFX.wrong(); FX.shake(); FX.vibrate(30); }
        scoreEl.textContent = score;
        arrowsLeftEl.textContent = Math.max(arrows,0);
        popup = { text: pts>0 ? '+'+pts : 'MISS', x: hitX, y: hitY-10*scale, alpha:1, color: pts>=8 ? '#FFC24B' : pts>0 ? '#2DD4BF' : '#FF6B4A' };
        fadePopup();
        speed += 18;
        if(arrows <= 0){
          animating = false;
          setTimeout(endGame, 500);
        } else {
          animating = false;
          shootBtn.disabled = false;
        }
      }
    }
    requestAnimationFrame(anim);
  }

  function fadePopup(){
    let f = 0;
    function step(){
      f++;
      if(popup) popup.alpha = Math.max(0, 1 - f/40);
      if(f < 40) requestAnimationFrame(step);
      else popup = null;
    }
    requestAnimationFrame(step);
  }

  function endGame(){
    cancelAnimationFrame(rafId);
    const best = parseInt(localStorage.getItem('archery_best') || '0', 10);
    if(score > best) localStorage.setItem('archery_best', score);
    loadBest();
    let title = '아쉬워요';
    if(score >= 45) title = '완벽한 명궁! 🏆';
    else if(score >= 30) title = '훌륭해요! 🎯';
    else if(score >= 15) title = '나쁘지 않아요';
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalScore').textContent = '총점 ' + score + '/50';
    overlay.classList.add('show');
  }

  shootBtn.addEventListener('click', shoot);
  document.getElementById('retryBtn').addEventListener('click', newGame);
  document.getElementById('newGameBtn').addEventListener('click', newGame);
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', e => { if(e.key === ' '){ e.preventDefault(); shoot(); } });

  newGame();
})();
</script>
</body>
</html>
