<style>
  :root{
    --bg-deep:#120A22; --card:#241640; --card-hi:#2E1B52;

    --coral:#FF6B4A; --teal:#2DD4BF; --amber:#FFC24B;
    --line: rgba(245,240,234,0.10);

  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    min-height:100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #35205C 0%, transparent 60%), var(--bg-deep);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    touch-action: none;

  .wrap{ width:100%; max-width:400px; display:flex; flex-direction:column; gap:10px; }
  a.back{ color:var(--muted); text-decoration:none; font-size:13px; }
  header{ text-align:center; }
  h1{ font-family:'Do Hyeon', sans-serif; font-size:28px; margin:4px 0 0;
      background: linear-gradient(90deg, var(--teal), var(--amber));

  header p{ margin:4px 0 0; color:var(--muted); font-size:12.5px; }

  .ad-slot{

    border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:rgba(245,240,234,0.35); font-size:11px; background:rgba(245,240,234,0.03);
  }

  .top-row{ display:flex; gap:6px; }
  .lang-row{ display:flex; gap:6px; justify-content:center; }
  .lang-btn{
    padding:6px 12px; border-radius:10px; border:1px solid var(--line);
    background: rgba(245,240,234,0.05); font-size:15px; cursor:pointer; opacity:0.5;

  .lang-btn.active{ opacity:1; background: rgba(45,212,191,0.18); border-color: rgba(45,212,191,0.4); }

  .stat-box{ flex:1; text-align:center; padding:6px 3px; border-radius:12px; background: rgba(245,240,234,0.06); border:1px solid var(--line); }
  .stat-box .lbl{ font-size:9.5px; color:var(--muted); }
  .stat-box .val{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:14px; }

  .outs-row{ display:flex; justify-content:center; gap:14px; font-size:13px; color:var(--muted); }

  .board-wrap{ position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
  #gameCanvas{ display:block; width:100%; height:auto; }

  .swing-btn{
    border:none; cursor:pointer; border-radius:16px; padding:18px; width:100%;
    background: linear-gradient(135deg, var(--coral), var(--amber)); color:#1B1030;
    font-weight:900; font-size:20px; font-family:'Do Hyeon', sans-serif; letter-spacing:1px;
  }
  .swing-btn:active{ transform: scale(0.96); }
  .swing-btn:disabled{ opacity:0.4; }

  .newgame-btn{ border:none; cursor:pointer; border-radius:12px; padding:10px; width:100%;
    background: rgba(245,240,234,0.08); border:1px solid var(--line); color:var(--muted); font-size:12.5px; }

  .overlay{
    position:fixed; inset:0; background: rgba(10,6,20,0.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:340px; background: linear-gradient(180deg, var(--card-hi), var(--card));
    border-radius:22px; border:1px solid var(--line); padding:26px 22px 22px; text-align:center;
    transform: translateY(14px) scale(0.96); transition: transform .25s ease; box-shadow: var(--shadow);
  }
  .overlay.show .modal{ transform: translateY(0) scale(1); }
  .modal .emoji{ font-size:40px; margin-bottom:4px; }
  .modal h2{ font-family:'Do Hyeon', sans-serif; font-size:24px; margin:4px 0 10px; }
  .modal .result-line{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13px; margin-bottom:4px; }
  .btn-retry{ margin-top:18px; width:100%; padding:14px; border:none; cursor:pointer; border-radius:14px;
    background: linear-gradient(135deg, var(--teal), var(--amber)); color:#1B1030; font-weight:900; font-size:15px; font-family:'Noto Sans KR', sans-serif; }

  /* ---- shared juice layer (screen fx) ---- */
  @keyframes fxShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .fx-shake{ animation: fxShake .32s ease; }
  .fx-flash-el{ position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0; animation: fxFlashAnim .26s ease; }
  @keyframes fxFlashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }
  .fx-pop{ position:fixed; transform:translate(-50%,-50%); font-family:'JetBrains Mono',monospace; font-weight:900; pointer-events:none; z-index:9999; animation: fxPopAnim .75s ease forwards; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
  @keyframes fxPopAnim{ 0%{transform:translate(-50%,-50%) scale(0.5); opacity:0;} 18%{transform:translate(-50%,-65%) scale(1.2); opacity:1;} 100%{transform:translate(-50%,-160%) scale(1); opacity:0;} }
  button{ transition: transform .08s ease; }
  button:active{ transform:scale(0.93); }
  @media (prefers-reduced-motion: reduce){ .fx-shake, .fx-flash-el, .fx-pop{ animation:none !important; } }
</style>

<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '24px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreVal = document.getElementById('scoreVal');
  const hitsVal = document.getElementById('hitsVal');
  const bestVal = document.getElementById('bestVal');
  const strikeDots = document.getElementById('strikeDots');
  const outDots = document.getElementById('outDots');
  const swingBtn = document.getElementById('swingBtn');
  const overlay = document.getElementById('overlay');

  // timing tiers: max ms error allowed -> outcome
  const TIERS = [
    { maxErr:45,  labelKey:'tier_homerun', bases:4, color:'#FFC24B' },
    { maxErr:100, labelKey:'tier_triple',  bases:3, color:'#8B7CF6' },
    { maxErr:170, labelKey:'tier_double',  bases:2, color:'#2DD4BF' },
    { maxErr:260, labelKey:'tier_single',  bases:1, color:'#60A5FA' },
    { maxErr:400, labelKey:'tier_foul',    bases:0, color:'#A79BC4' },
  ];
  const IDEAL_T = 0.87; // fraction of flight where the ball crosses the plate

  let W, H, scale;
  let score, hits, strikes, outs, pitchCount, over, pitching, best;
  let lastModal = null;

  const LANG = {
    ko: {
      title:'타격왕 챌린지', subtitle:'타이밍에 맞춰 스윙하세요 · 3아웃 전에 최고 점수 도전',
      stat_score:'점수', stat_hits:'안타', stat_best:'최고 점수',
      label_strike:'스트라이크', label_out:'아웃',
      btn_swing:'스윙!', btn_newgame:'새 게임 시작', btn_retry:'다시 하기',
      tier_homerun:'홈런! 🎉', tier_triple:'3루타!', tier_double:'2루타!', tier_single:'안타!', tier_foul:'파울',
      popup_foul:'파울 ⚾', popup_strike:'스트라이크!', popup_out:'아웃!',
      title_grandslam:'역전 만루홈런! 🏆', title_great:'훌륭한 타격이에요! 🎉', title_normal:'경기 종료!',
      modal_score:(s)=>`총점 ${s}`, modal_hits:(h,p)=>`안타 ${h}개 · ${p}구 타석`,
    },
    en: {
      title:'Batting King Challenge', subtitle:'Time your swing · Chase the high score before 3 outs',
      stat_score:'Score', stat_hits:'Hits', stat_best:'Best',
      label_strike:'Strikes', label_out:'Outs',
      btn_swing:'Swing!', btn_newgame:'New Game', btn_retry:'Try Again',
      tier_homerun:'Home Run! 🎉', tier_triple:'Triple!', tier_double:'Double!', tier_single:'Single!', tier_foul:'Foul',
      popup_foul:'Foul ⚾', popup_strike:'Strike!', popup_out:'Out!',
      title_grandslam:'Grand Slam! 🏆', title_great:'Great hitting! 🎉', title_normal:'Game Over!',
      modal_score:(s)=>`Score ${s}`, modal_hits:(h,p)=>`${h} hits · ${p} pitches`,
    },
    es: {
      title:'Desafío de Bateo', subtitle:'Sincroniza tu swing · Busca el máximo puntaje antes de 3 outs',
      stat_score:'Puntos', stat_hits:'Hits', stat_best:'Mejor',
      label_strike:'Strikes', label_out:'Outs',
      btn_swing:'¡Batear!', btn_newgame:'Nueva partida', btn_retry:'Reintentar',
      tier_homerun:'¡Jonrón! 🎉', tier_triple:'¡Triple!', tier_double:'¡Doble!', tier_single:'¡Hit!', tier_foul:'Foul',
      popup_foul:'Foul ⚾', popup_strike:'¡Strike!', popup_out:'¡Out!',
      title_grandslam:'¡Grand Slam! 🏆', title_great:'¡Excelente bateo! 🎉', title_normal:'¡Fin del juego!',
      modal_score:(s)=>`Puntos ${s}`, modal_hits:(h,p)=>`${h} hits · ${p} lanzamientos`,
    }
  };
  function currentLang(){ return localStorage.getItem('norixa_lang') || 'ko'; }
  function t(key, ...args){
    const dict = LANG[currentLang()] || LANG.ko;
    const val = dict[key];
    if(typeof val === 'function') return val(...args);
    return val !== undefined ? val : (LANG.ko[key] || key);
  }
  function applyLang(){
    const lang = currentLang();
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('.lang-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.lang === lang); });
    if(lastModal){
      document.getElementById('modalTitle').textContent = t('title_' + lastModal.tier);
      document.getElementById('modalScore').textContent = t('modal_score', lastModal.score);
      document.getElementById('modalHits').textContent = t('modal_hits', lastModal.hits, lastModal.pitchCount);
    }
  }
  document.getElementById('langRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if(!btn) return;
    localStorage.setItem('norixa_lang', btn.dataset.lang);
    applyLang();
  });
  let ballT, pitchStartTs, pitchDuration, rafId, resultPopup;

  function loadBest(){ best = parseInt(localStorage.getItem('battingking_best') || '0', 10); bestVal.textContent = best; }

  function resize(){
    const wrapWidth = canvas.parentElement.clientWidth;
    scale = wrapWidth / 360;
    canvas.width = wrapWidth;
    canvas.height = wrapWidth * (320/360);
    W = canvas.width; H = canvas.height;
  }

  function renderDots(){
    strikeDots.textContent = '●'.repeat(strikes) + '○'.repeat(3-strikes);
    outDots.textContent = '●'.repeat(outs) + '○'.repeat(3-outs);
  }

  function newGame(){
    score = 0; hits = 0; strikes = 0; outs = 0; pitchCount = 0;
    over = false; pitching = false; resultPopup = null;
    scoreVal.textContent = '0'; hitsVal.textContent = '0';
    overlay.classList.remove('show');
    loadBest();
    renderDots();
    resize();
    cancelAnimationFrame(rafId);
    draw();
    setTimeout(startPitch, 500);
  }

  function pitchSpeedForCount(n){
    // gets a little faster as the at-bat goes on, floors out so it stays fair
    return Math.max(650, 1100 - n*15);
  }

  function startPitch(){
    if(over) return;
    pitching = true;
    swingBtn.disabled = false;
    ballT = 0;
    pitchDuration = pitchSpeedForCount(pitchCount);
    pitchStartTs = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(pitchLoop);
  }

  function pitchLoop(ts){
    if(!pitching) return;
    const elapsed = ts - pitchStartTs;
    ballT = elapsed / pitchDuration;
    if(ballT >= 1){
      ballT = 1;
      draw();
      resolvePitch(null); // no swing in time = called strike
      return;
    }
    draw();
    rafId = requestAnimationFrame(pitchLoop);
  }

  function draw(){
    ctx.fillStyle = '#1B1030';
    ctx.fillRect(0,0,W,H);

    // pitcher mound
    ctx.fillStyle = 'rgba(245,240,234,0.5)';
    ctx.beginPath();
    ctx.arc(W/2, 40*scale, 12*scale, 0, Math.PI*2);
    ctx.fill();

    // strike zone box near the plate
    const zoneW = 90*scale, zoneH = 70*scale;
    const zoneX = W/2 - zoneW/2, zoneY = H - 118*scale;
    ctx.strokeStyle = 'rgba(255,194,75,0.5)';
    ctx.lineWidth = 2*scale;
    ctx.strokeRect(zoneX, zoneY, zoneW, zoneH);

    // batter
    ctx.font = (26*scale) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🧍', W/2, H - 24*scale);

    // ball: travels from mound to plate, growing as it approaches (perspective)
    if(pitching){
      const startY = 55*scale, endY = H - 95*scale;
      const y = startY + (endY-startY)*ballT;
      const r = (4 + 10*ballT) * scale;
      ctx.fillStyle = '#F5F0EA';
      ctx.beginPath();
      ctx.arc(W/2, y, r, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,107,74,0.8)';
      ctx.lineWidth = 1.2*scale;
      ctx.stroke();
    }

    if(resultPopup){
      ctx.fillStyle = resultPopup.color;
      ctx.font = 'bold ' + (24*scale) + 'px "Do Hyeon", sans-serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = resultPopup.alpha;
      ctx.fillText(resultPopup.text, W/2, H/2);
      ctx.globalAlpha = 1;
    }
  }

  function fadePopup(){
    let f = 0;
    function step(){
      f++;
      if(resultPopup) resultPopup.alpha = Math.max(0, 1 - f/35);
      if(f < 35){ requestAnimationFrame(step); } else { resultPopup = null; }
    }
    requestAnimationFrame(step);
  }

  function swing(){
    if(!pitching || over) return;
    resolvePitch(ballT);
  }

  function resolvePitch(tAtSwing){
    pitching = false;
    swingBtn.disabled = true;
    cancelAnimationFrame(rafId);
    pitchCount++;

    let tier = null;
    if(tAtSwing !== null){
      const errMs = Math.abs(tAtSwing - IDEAL_T) * pitchDuration;
      tier = TIERS.find(t => errMs <= t.maxErr) || null;
    }

    if(tier && tier.bases > 0){
      hits++;
      score += tier.bases;
      hitsVal.textContent = hits;
      scoreVal.textContent = score;
      SFX.win(); FX.flash('rgba(255,194,75,0.28)'); FX.vibrate([30,25,60]);
      const label = t(tier.labelKey);
      resultPopup = { text: label, alpha:1, color: tier.color };
      FX.popText(label, null, null, tier.color);
    } else if(tier && tier.bases === 0){
      // foul: wastes the pitch, no strike change, no score
      SFX.pop();
      resultPopup = { text: t('tier_foul'), alpha:1, color:'#A79BC4' };
      FX.popText(t('popup_foul'), null, null, 'var(--muted)');
    } else {
      strikes++;
      SFX.wrong(); FX.shake(); FX.vibrate(30);
      resultPopup = { text: t('label_strike'), alpha:1, color:'#FF6B4A' };
      FX.popText(t('popup_strike'), null, null, 'var(--coral)');
      renderDots();
      if(strikes >= 3){
        strikes = 0;
        outs++;
        renderDots();
        FX.popText(t('popup_out'), null, null, 'var(--coral)');
        if(outs >= 3){
          fadePopup();
          draw();
          setTimeout(endGame, 700);
          return;
        }
      }
    }
    renderDots();
    fadePopup();
    draw();
    setTimeout(startPitch, 900);
  }

  function endGame(){
    over = true;
    SFX.lose();
    if(score > best){ localStorage.setItem('battingking_best', score); }
    loadBest();
    let tier = 'normal';
    if(score >= 15) tier = 'grandslam';
    else if(score >= 8) tier = 'great';
    lastModal = { tier, score, hits, pitchCount };
    document.getElementById('modalTitle').textContent = t('title_' + tier);
    document.getElementById('modalScore').textContent = t('modal_score', score);
    document.getElementById('modalHits').textContent = t('modal_hits', hits, pitchCount);
    overlay.classList.add('show');
  }

  swingBtn.addEventListener('click', swing);
  document.getElementById('retryBtn').addEventListener('click', () => { SFX.click(); newGame(); });
  document.getElementById('newGameBtn').addEventListener('click', () => { SFX.click(); newGame(); });
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', e => { if(e.key === ' '){ e.preventDefault(); swing(); } });

  newGame();
  applyLang();
})();
</script>
</body>
</html>
