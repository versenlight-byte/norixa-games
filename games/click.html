<html lang="ko">
<head>

<title>반응속도 테스트 - Norixa</title>

<meta name="description" content="신호가 뜨면 최대한 빠르게 탭하는 반응속도 테스트 게임. 5라운드 평균 기록 측정.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1030; --bg-deep:#120A22; --card:#241640; --card-hi:#2E1B52;
    --ink:#F5F0EA; --muted:#A79BC4;
    --coral:#FF6B4A; --teal:#2DD4BF; --amber:#FFC24B;
    --line: rgba(245,240,234,0.10);
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    min-height:100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #35205C 0%, transparent 60%), var(--bg-deep);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
  }
  .wrap{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:14px; }
  a.back{ color:var(--muted); text-decoration:none; font-size:13px; }
  header{ text-align:center; }
  h1{ font-family:'Do Hyeon', sans-serif; font-size:32px; margin:6px 0 0;
      background: linear-gradient(90deg, var(--coral), var(--amber));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ margin:6px 0 0; color:var(--muted); font-size:13.5px; }

  .ad-slot{
    width:100%; min-height:60px; border:1px dashed rgba(245,240,234,0.22);
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:rgba(245,240,234,0.35); font-size:12px; background:rgba(245,240,234,0.03);
  }

  .statbar{
    display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace;
    font-size:12.5px; color:var(--muted);
  }
  .statbar b{ color:var(--ink); }

  .pad{
    height:320px; border-radius:22px; border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; text-align:center; cursor:pointer; user-select:none;
    transition: background .15s ease;
    box-shadow: var(--shadow);
  }
  .pad.wait{ background: linear-gradient(180deg, var(--card-hi), var(--card)); }
  .pad.go{ background: linear-gradient(180deg, #22C55E, #16A34A); }
  .pad.early{ background: linear-gradient(180deg, var(--coral), #C1401F); }
  .pad .big{ font-family:'Do Hyeon', sans-serif; font-size:26px; }
  .pad .small{ color:rgba(245,240,234,0.75); font-size:13px; }
  .pad .ms{ font-family:'JetBrains Mono', monospace; font-size:40px; font-weight:700; }

  .rounds{ display:flex; gap:6px; justify-content:center; }
  .dot{
    width:10px; height:10px; border-radius:50%;
    background: rgba(245,240,234,0.15);
  }
  .dot.done{ background: var(--teal); }

  .overlay{
    position:fixed; inset:0; background: rgba(10,6,20,0.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:360px;
    background: linear-gradient(180deg, var(--card-hi), var(--card));
    border-radius:22px; border:1px solid var(--line);
    padding:28px 24px 24px; text-align:center;
    transform: translateY(14px) scale(0.96); transition: transform .25s ease;
    box-shadow: var(--shadow);
  }
  .overlay.show .modal{ transform: translateY(0) scale(1); }
  .modal .emoji{ font-size:44px; margin-bottom:6px; }
  .modal h2{ font-family:'Do Hyeon', sans-serif; font-size:26px; margin:4px 0 12px; }
  .modal .result-line{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13.5px; margin-bottom:4px; }
  .btn-retry{
    margin-top:20px; width:100%; padding:15px; border:none; cursor:pointer;
    border-radius:14px; background: linear-gradient(135deg, var(--teal), var(--amber));
    color:#1B1030; font-weight:900; font-size:16px; font-family:'Noto Sans KR', sans-serif;
  }
  .btn-retry:active{ transform: scale(0.97); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* ---- shared juice layer (screen fx) ---- */
  @keyframes fxShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .fx-shake{ animation: fxShake .32s ease; }
  .fx-flash-el{ position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0; animation: fxFlashAnim .26s ease; }
  @keyframes fxFlashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }
  .fx-pop{ position:fixed; transform:translate(-50%,-50%); font-family:'JetBrains Mono',monospace; font-weight:900; pointer-events:none; z-index:9999; animation: fxPopAnim .75s ease forwards; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
  @keyframes fxPopAnim{ 0%{transform:translate(-50%,-50%) scale(0.5); opacity:0;} 18%{transform:translate(-50%,-65%) scale(1.2); opacity:1;} 100%{transform:translate(-50%,-160%) scale(1); opacity:0;} }
  button{ transition: transform .08s ease; }
  button:active{ transform:scale(0.93); }
  @media (prefers-reduced-motion: reduce){ .fx-shake, .fx-flash-el, .fx-pop{ animation:none !important; } }
</style>

<body>
<div class="wrap">
  <a class="back" href="../index.html">← 게임 목록으로</a>
  <header>
    <h1>반응속도 테스트</h1>
    <p>초록색으로 바뀌는 순간 최대한 빠르게 탭하세요 · 5라운드</p>
  </header>

  <ins class="adsbygoogle ad-slot"
       style="display:block"
       data-ad-client="ca-pub-5727459571536294"
       data-ad-slot="REPLACE_WITH_AD_SLOT_ID"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div class="statbar">
    <span>라운드 <b id="statRound">0</b>/5</span>
    <span>평균 <b id="statAvg">-</b></span>
    <span>최고 기록 <b id="statBest">-</b></span>
  </div>

  <div class="rounds" id="rounds"></div>

  <div class="pad wait" id="pad">
    <div class="big" id="padText">탭해서 시작</div>
    <div class="small" id="padSub">준비되면 눌러주세요</div>
  </div>

  <ins class="adsbygoogle ad-slot"
       style="display:block"
       data-ad-client="ca-pub-5727459571536294"
       data-ad-slot="REPLACE_WITH_AD_SLOT_ID"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div style="margin-top:4px;"><p style="text-align:center;color:var(--muted);font-size:12px;margin:0 0 8px;">🎮 다른 게임도 해보세요</p><div style="display:flex;gap:8px;flex-wrap:wrap;"><a href="puzzle.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">🧩<br><span style="font-size:11.5px;">2048</span></a><a href="wordchain.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">🗣️<br><span style="font-size:11.5px;">끝말잇기</span></a><a href="omok.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">⚫<br><span style="font-size:11.5px;">오목</span></a></div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="emoji">⚡</div>
    <h2>측정 완료!</h2>
    <div class="result-line" id="modalAvg">평균 000ms</div>
    <div class="result-line" id="modalBest">최고 기록 000ms</div>
    <button class="btn-retry" id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '22px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const pad = document.getElementById('pad');
  const padText = document.getElementById('padText');
  const padSub = document.getElementById('padSub');
  const statRound = document.getElementById('statRound');
  const statAvg = document.getElementById('statAvg');
  const statBest = document.getElementById('statBest');
  const roundsEl = document.getElementById('rounds');
  const overlay = document.getElementById('overlay');
  const retryBtn = document.getElementById('retryBtn');

  const TOTAL_ROUNDS = 5;
  let state = 'idle'; // idle | waiting | go | early
  let timeoutId, goTime;
  let times = [];

  function loadBest(){
    const best = localStorage.getItem('click_best_avg');
    statBest.textContent = best ? Math.round(best) + 'ms' : '-';
  }

  function renderDots(){
    roundsEl.innerHTML = '';
    for(let i=0;i<TOTAL_ROUNDS;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i < times.length ? ' done' : '');
      roundsEl.appendChild(d);
    }
  }

  function resetGame(){
    times = [];
    state = 'idle';
    statRound.textContent = '0';
    statAvg.textContent = '-';
    renderDots();
    setIdle();
    overlay.classList.remove('show');
  }

  function setIdle(){
    state = 'idle';
    pad.className = 'pad wait';
    padText.textContent = times.length === 0 ? '탭해서 시작' : '탭해서 다음 라운드';
    padSub.textContent = '준비되면 눌러주세요';
  }

  function startWait(){
    state = 'waiting';
    pad.className = 'pad wait';
    padText.textContent = '기다리세요...';
    padSub.textContent = '초록색이 되면 탭!';
    const delay = 1000 + Math.random()*2500;
    timeoutId = setTimeout(()=>{
      state = 'go';
      goTime = Date.now();
      pad.className = 'pad go';
      padText.textContent = '지금 탭!';
      padSub.textContent = '';
    }, delay);
  }

  function showEarly(){
    SFX.wrong(); FX.shake(); FX.vibrate(30);
    clearTimeout(timeoutId);
    state = 'early';
    pad.className = 'pad early';
    padText.textContent = '너무 빨랐어요!';
    padSub.textContent = '초록색이 될 때까지 기다려주세요';
    setTimeout(()=>{ setIdle(); }, 900);
  }

  function registerHit(){
    SFX.pop();
    const reaction = Date.now() - goTime;
    times.push(reaction);
    statRound.textContent = times.length;
    renderDots();
    pad.className = 'pad go';
    padText.textContent = reaction + 'ms';
    padSub.textContent = reaction < 250 ? '엄청 빨라요! 🔥' : '기록 완료';
    if(reaction < 250){ FX.popText('번개같아요! ⚡', null, null, 'var(--amber)'); FX.vibrate([15,20,15]); }

    if(times.length >= TOTAL_ROUNDS){
      setTimeout(finish, 700);
    } else {
      setTimeout(setIdle, 700);
    }
  }

  function finish(){
    SFX.win(); FX.flash('rgba(255,194,75,0.32)'); FX.vibrate([35,30,70]);
    const avg = times.reduce((a,b)=>a+b,0) / times.length;
    statAvg.textContent = Math.round(avg) + 'ms';
    const prevBest = parseFloat(localStorage.getItem('click_best_avg') || '99999');
    if(avg < prevBest) localStorage.setItem('click_best_avg', avg);
    loadBest();

    document.getElementById('modalAvg').textContent = '평균 ' + Math.round(avg) + 'ms';
    document.getElementById('modalBest').textContent = '최고 기록 ' + Math.round(parseFloat(localStorage.getItem('click_best_avg'))) + 'ms';
    overlay.classList.add('show');
  }

  pad.addEventListener('click', ()=>{
    if(state === 'idle'){ startWait(); }
    else if(state === 'waiting'){ showEarly(); }
    else if(state === 'go'){ registerHit(); }
  });

  retryBtn.addEventListener('click', resetGame);

  loadBest();
  renderDots();
})();
</script>
</body>
</html>
