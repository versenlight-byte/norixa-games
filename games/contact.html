<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#120A22; --card:#241640; --card-hi:#2E1B52;
    --ink:#F5F0EA; --muted:#A79BC4;
    --coral:#FF6B4A; --teal:#2DD4BF; --amber:#FFC24B;
    --line: rgba(245,240,234,0.10);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #35205C 0%, transparent 60%), var(--bg-deep);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif;
    display:flex; justify-content:center;
    padding: 24px 16px 40px;
  }
  .wrap{ width:100%; max-width:480px; }
  a.back{ color:var(--muted); text-decoration:none; font-size:13px; }
  h1{ font-family:'Do Hyeon', sans-serif; font-size:30px; margin:14px 0 18px;
      background: linear-gradient(90deg, var(--teal), var(--amber) 55%, var(--coral));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card{
    background: linear-gradient(180deg, var(--card-hi), var(--card));
    border:1px solid var(--line); border-radius:18px; padding:22px 20px;
    line-height:1.7; font-size:14.5px;
  }
  .mail-btn{
    display:block; text-align:center; text-decoration:none;
    margin-top:16px; padding:15px; border-radius:14px;
    background: linear-gradient(135deg, var(--teal), var(--amber));
    color:#1B1030; font-weight:900; font-size:16px;
  }
  .mail-btn:active{ transform: scale(0.98); }
  .note{ color:var(--muted); font-size:12.5px; margin-top:14px; }
  ul{ padding-left:20px; margin:6px 0; }
  li{ margin-bottom:4px; }
  footer{ text-align:center; margin-top:20px; }
  footer a{ color:var(--muted); font-size:12.5px; text-decoration:none; margin:0 8px; }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4196209515730511"
     crossorigin="anonymous"></script>
</head>

<div class="wrap">
  <a class="back" href="index.html">← 게임 목록으로</a>
  <h1>문의</h1>
  <div class="card">
    <p>아래와 같은 내용은 언제든 이메일로 보내주세요.</p>
    <ul>
      <li>새로운 게임 아이디어 제안</li>
      <li>버그·오류 제보</li>
      <li>광고·제휴 문의</li>
      <li>기타 건의사항</li>
    </ul>
    <a class="mail-btn" href="mailto:abad312@gmail.com?subject=심심풀이%20놀이터%20문의">이메일로 문의하기</a>
  </div>
  <footer>
    <a href="index.html">홈</a>
    <a href="about.html">소개</a>
    <a href="privacy.html">개인정보처리방침</a>
  </footer>
</div>
