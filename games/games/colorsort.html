<style>
  :root{
    --bg-deep:#120A22; --card:#241640; --card-hi:#2E1B52;
    --ink:#F5F0EA; --muted:#A79BC4;
    --coral:#FF6B4A; --teal:#2DD4BF; --amber:#FFC24B;
    --line: rgba(245,240,234,0.10);
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    min-height:100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #35205C 0%, transparent 60%), var(--bg-deep);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
    touch-action: manipulation;
  }
  .wrap{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; }
  a.back{ color:var(--muted); text-decoration:none; font-size:13px; }
  header{ text-align:center; }
  h1{ font-family:'Do Hyeon', sans-serif; font-size:30px; margin:6px 0 0;
      background: linear-gradient(90deg, var(--teal), var(--amber));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ margin:6px 0 0; color:var(--muted); font-size:13px; }

  .ad-slot{
    width:100%; min-height:60px; border:1px dashed rgba(245,240,234,0.22);
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:rgba(245,240,234,0.35); font-size:12px; background:rgba(245,240,234,0.03);
  }

  .lang-row{ display:flex; gap:6px; justify-content:center; }
  .lang-btn{
    padding:6px 12px; border-radius:10px; border:1px solid var(--line);
    background: rgba(245,240,234,0.05); font-size:15px; cursor:pointer; opacity:0.5;
  }
  .lang-btn.active{ opacity:1; background: rgba(45,212,191,0.18); border-color: rgba(45,212,191,0.4); }

  .statbar{ display:flex; gap:8px; }
  .stat-box{ flex:1; text-align:center; padding:8px 6px; border-radius:12px; background: rgba(245,240,234,0.06); border:1px solid var(--line); }
  .stat-box .lbl{ font-size:10.5px; color:var(--muted); }
  .stat-box .val{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:16px; }

  .toolbar{ display:flex; gap:8px; }
  .tool-btn{
    flex:1; padding:11px; border-radius:12px; border:1px solid var(--line); cursor:pointer;
    background: rgba(245,240,234,0.06); color:var(--ink); font-size:13px; font-weight:700;
    font-family:'Noto Sans KR', sans-serif;
  }
  .tool-btn:disabled{ opacity:0.35; }

  .board{
    background: var(--card); border-radius:18px; border:1px solid var(--line); box-shadow: var(--shadow);
    padding:20px 12px 10px; display:flex; flex-wrap:wrap; gap:12px 10px; justify-content:center; align-items:flex-end;
    min-height:220px;
  }
  .tube{
    width:44px; height:172px; border-radius:8px 8px 20px 20px;
    background: rgba(245,240,234,0.05);
    border:3px solid rgba(245,240,234,0.18); border-top:none;
    display:flex; flex-direction:column-reverse; overflow:hidden;
    cursor:pointer; transition: transform .12s ease, border-color .15s ease;
    position:relative;
  }
  .tube.selected{ transform: translateY(-14px); border-color: var(--teal); box-shadow:0 0 0 2px rgba(45,212,191,0.35); }
  .tube-seg{ width:100%; height:25%; flex-shrink:0; animation: segIn .18s ease; }
  @keyframes segIn{ 0%{ transform:scaleY(0); transform-origin:bottom; } 100%{ transform:scaleY(1); transform-origin:bottom; } }
  .tube-cap{ position:absolute; top:-9px; left:-3px; right:-3px; height:9px; border-radius:6px 6px 0 0; background: rgba(245,240,234,0.10); }

  .hint{ text-align:center; color:var(--muted); font-size:12.5px; }

  .overlay{
    position:fixed; inset:0; background: rgba(10,6,20,0.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:360px;
    background: linear-gradient(180deg, var(--card-hi), var(--card));
    border-radius:22px; border:1px solid var(--line);
    padding:28px 24px 24px; text-align:center;
    transform: translateY(14px) scale(0.96); transition: transform .25s ease;
    box-shadow: var(--shadow);
  }
  .overlay.show .modal{ transform: translateY(0) scale(1); }
  .modal .emoji{ font-size:44px; margin-bottom:6px; }
  .modal h2{ font-family:'Do Hyeon', sans-serif; font-size:26px; margin:4px 0 12px; }
  .modal .result-line{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13.5px; margin-bottom:4px; }
  .btn-retry{
    margin-top:20px; width:100%; padding:15px; border:none; cursor:pointer;
    border-radius:14px; background: linear-gradient(135deg, var(--teal), var(--amber));
    color:#1B1030; font-weight:900; font-size:16px; font-family:'Noto Sans KR', sans-serif;
  }

  /* ---- shared juice layer (screen fx) ---- */
  @keyframes fxShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .fx-shake{ animation: fxShake .32s ease; }
  .fx-flash-el{ position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0; animation: fxFlashAnim .26s ease; }
  @keyframes fxFlashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }
  .fx-pop{ position:fixed; transform:translate(-50%,-50%); font-family:'JetBrains Mono',monospace; font-weight:900; pointer-events:none; z-index:9999; animation: fxPopAnim .75s ease forwards; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
  @keyframes fxPopAnim{ 0%{transform:translate(-50%,-50%) scale(0.5); opacity:0;} 18%{transform:translate(-50%,-65%) scale(1.2); opacity:1;} 100%{transform:translate(-50%,-160%) scale(1); opacity:0;} }
  button{ transition: transform .08s ease; }
  button:active{ transform:scale(0.93); }
  @media (prefers-reduced-motion: reduce){ .fx-shake, .fx-flash-el, .fx-pop, .tube-seg{ animation:none !important; } }

<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '22px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const CAPACITY = 4;
  const COLOR_DEFS = [
    '#2DD4BF','#FFC24B','#FF6B4A','#8B7CF6','#60A5FA','#22C55E','#F472B6','#F5F0EA'
  ];

  const board = document.getElementById('board');
  const levelVal = document.getElementById('levelVal');
  const movesVal = document.getElementById('movesVal');
  const bestVal = document.getElementById('bestVal');
  const undoBtn = document.getElementById('undoBtn');
  const restartBtn = document.getElementById('restartBtn');
  const overlay = document.getElementById('overlay');
  const stuckOverlay = document.getElementById('stuckOverlay');
  const nextBtn = document.getElementById('nextBtn');
  const stuckRestartBtn = document.getElementById('stuckRestartBtn');

  let level, tubes, selected, moves, history, initialTubes, over;
  let lastClear = null;

  const LANG = {
    ko: {
      title:'컬러 소트 퍼즐', subtitle:'병을 탭해서 같은 색끼리 모아보세요',
      stat_level:'레벨', stat_moves:'이동', stat_best:'최고 레벨',
      btn_undo:'↩️ 되돌리기', btn_restart:'🔄 이 레벨 다시',
      hint_controls:'👆 병을 탭해서 선택 → 부을 병을 탭하세요',
      clear_title:'레벨 클리어!', btn_next:'다음 레벨 →',
      clear_line:(l,m)=>`레벨 ${l} 완료 · ${m}번 만에 성공`,
      stuck_title:'더 이상 움직일 수 없어요', stuck_line:'되돌리기를 몇 번 해보거나, 이 레벨을 다시 시작해보세요.',
      btn_stuck_restart:'이 레벨 다시 시작',
    },
    en: {
      title:'Color Sort Puzzle', subtitle:'Tap bottles to sort each color together',
      stat_level:'Level', stat_moves:'Moves', stat_best:'Best Level',
      btn_undo:'↩️ Undo', btn_restart:'🔄 Restart Level',
      hint_controls:'👆 Tap a bottle to select → tap another to pour',
      clear_title:'Level Cleared!', btn_next:'Next Level →',
      clear_line:(l,m)=>`Level ${l} cleared · ${m} moves`,
      stuck_title:'No more moves left', stuck_line:'Try undoing a few moves, or restart this level.',
      btn_stuck_restart:'Restart This Level',
    },
    es: {
      title:'Puzzle de Colores', subtitle:'Toca las botellas para juntar cada color',
      stat_level:'Nivel', stat_moves:'Movs', stat_best:'Mejor nivel',
      btn_undo:'↩️ Deshacer', btn_restart:'🔄 Reiniciar nivel',
      hint_controls:'👆 Toca una botella para elegirla → toca otra para verter',
      clear_title:'¡Nivel completado!', btn_next:'Siguiente nivel →',
      clear_line:(l,m)=>`Nivel ${l} completado · ${m} movimientos`,
      stuck_title:'No quedan movimientos', stuck_line:'Prueba deshacer algunos movimientos o reinicia este nivel.',
      btn_stuck_restart:'Reiniciar este nivel',
    }
  };
  function currentLang(){ return localStorage.getItem('norixa_lang') || 'ko'; }
  function t(key, ...args){
    const dict = LANG[currentLang()] || LANG.ko;
    const val = dict[key];
    if(typeof val === 'function') return val(...args);
    return val !== undefined ? val : (LANG.ko[key] || key);
  }
  function applyLang(){
    const lang = currentLang();
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('.lang-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.lang === lang); });
    if(lastClear) document.getElementById('clearLine').textContent = t('clear_line', lastClear.level, lastClear.moves);
  }
  document.getElementById('langRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if(!btn) return;
    localStorage.setItem('norixa_lang', btn.dataset.lang);
    applyLang();
  });

  function loadBest(){ bestVal.textContent = localStorage.getItem('colorsort_best_level') || '1'; }

  // ---- puzzle generation ----
  function numColorsForLevel(lv){
    return Math.min(4 + Math.floor((lv-1)/2), 8);
  }

  function makeSolvedTubes(numColors){
    const t = [];
    for(let c=0;c<numColors;c++){
      t.push(Array(CAPACITY).fill(c));
    }
    t.push([]); // empty tube
    t.push([]); // empty tube
    return t;
  }

  function cloneTubes(t){ return t.map(tube => tube.slice()); }

  function legalMove(t, i, j){
    if(i === j) return false;
    const src = t[i], dst = t[j];
    if(src.length === 0) return false;
    if(dst.length >= CAPACITY) return false;
    if(dst.length > 0 && dst[dst.length-1] !== src[src.length-1]) return false;
    return true;
  }

  function applyMove(t, i, j){
    const src = t[i], dst = t[j];
    const color = src[src.length-1];
    let moveCount = 0;
    while(src.length > 0 && src[src.length-1] === color && dst.length < CAPACITY){
      dst.push(src.pop());
      moveCount++;
    }
    return moveCount;
  }

  function stateKey(t){
    return t.map(tube => tube.join(',')).join('|');
  }

  function isSolved(t){
    return t.every(tube => tube.length === 0 || (tube.length === CAPACITY && tube.every(c => c === tube[0])));
  }

  // random shuffle by performing random legal forward moves from a solved state,
  // which guarantees the resulting position is solvable (just reverse the moves).
  function shuffleFromSolved(numColors, shuffleSteps){
    let t = makeSolvedTubes(numColors);
    let lastMove = null;
    for(let step=0; step<shuffleSteps; step++){
      const candidates = [];
      for(let i=0;i<t.length;i++){
        for(let j=0;j<t.length;j++){
          if(i===j) continue;
          if(!legalMove(t,i,j)) continue;
          // avoid immediately undoing the previous move (keeps shuffle productive)
          if(lastMove && lastMove.i===j && lastMove.j===i) continue;
          candidates.push([i,j]);
        }
      }
      if(candidates.length === 0) break;
      const [i,j] = candidates[Math.floor(Math.random()*candidates.length)];
      applyMove(t, i, j);
      lastMove = {i,j};
    }
    return t;
  }

  // BFS solvability check with a state cap, so we never show an impossible puzzle.
  function isSolvable(startTubes, maxStates){
    maxStates = maxStates || 60000;
    const startKey = stateKey(startTubes);
    if(isSolved(startTubes)) return true;
    const visited = new Set([startKey]);
    let frontier = [startTubes];
    let explored = 0;
    while(frontier.length > 0 && explored < maxStates){
      const nextFrontier = [];
      for(const t of frontier){
        for(let i=0;i<t.length;i++){
          for(let j=0;j<t.length;j++){
            if(i===j) continue;
            if(!legalMove(t,i,j)) continue;
            const nt = cloneTubes(t);
            applyMove(nt, i, j);
            const key = stateKey(nt);
            if(visited.has(key)) continue;
            if(isSolved(nt)) return true;
            visited.add(key);
            nextFrontier.push(nt);
            explored++;
            if(explored >= maxStates) break;
          }
          if(explored >= maxStates) break;
        }
        if(explored >= maxStates) break;
      }
      frontier = nextFrontier;
    }
    return false;
  }

  function generateLevel(lv){
    const numColors = numColorsForLevel(lv);
    const shuffleSteps = 30 + numColors * 8;
    for(let attempt=0; attempt<12; attempt++){
      const candidate = shuffleFromSolved(numColors, shuffleSteps);
      // quick reject: already solved (too little shuffling) -> retry
      if(isSolved(candidate)) continue;
      if(isSolvable(candidate)) return candidate;
    }
    // extremely unlikely fallback: lightly shuffled but guaranteed solvable
    return shuffleFromSolved(numColors, Math.max(6, numColors));
  }

  // ---- rendering ----
  function render(){
    board.innerHTML = '';
    tubes.forEach((tube, idx) => {
      const el = document.createElement('div');
      el.className = 'tube' + (selected === idx ? ' selected' : '');
      const cap = document.createElement('div');
      cap.className = 'tube-cap';
      el.appendChild(cap);
      tube.forEach(colorIdx => {
        const seg = document.createElement('div');
        seg.className = 'tube-seg';
        seg.style.background = COLOR_DEFS[colorIdx];
        el.appendChild(seg);
      });
      el.addEventListener('click', () => onTubeClick(idx));
      board.appendChild(el);
    });
    movesVal.textContent = moves;
    levelVal.textContent = level;
    undoBtn.disabled = history.length === 0;
  }

  function pushHistory(){
    history.push({ tubes: cloneTubes(tubes), moves });
    if(history.length > 50) history.shift();
  }

  function onTubeClick(idx){
    if(over) return;
    if(selected === null){
      if(tubes[idx].length === 0) return;
      selected = idx;
      SFX.click();
      render();
      return;
    }
    if(selected === idx){
      selected = null;
      render();
      return;
    }
    if(legalMove(tubes, selected, idx)){
      pushHistory();
      applyMove(tubes, selected, idx);
      moves++;
      SFX.pop();
      selected = null;
      render();
      checkGameState();
    } else {
      SFX.wrong();
      FX.shake();
      selected = null;
      render();
    }
  }

  function hasAnyLegalMove(){
    for(let i=0;i<tubes.length;i++){
      for(let j=0;j<tubes.length;j++){
        if(i===j) continue;
        if(legalMove(tubes, i, j)) return true;
      }
    }
    return false;
  }

  function checkGameState(){
    if(isSolved(tubes)){
      over = true;
      SFX.win(); FX.flash('rgba(255,194,75,0.32)'); FX.vibrate([35,30,70]);
      const best = parseInt(localStorage.getItem('colorsort_best_level') || '1', 10);
      if(level >= best) localStorage.setItem('colorsort_best_level', level+1);
      loadBest();
      lastClear = { level, moves };
      document.getElementById('clearLine').textContent = t('clear_line', level, moves);
      overlay.classList.add('show');
      return;
    }
    if(!hasAnyLegalMove()){
      over = true;
      SFX.lose(); FX.shake(); FX.vibrate([70,40,70]);
      stuckOverlay.classList.add('show');
    }
  }

  function startLevel(lv){
    level = lv;
    tubes = generateLevel(lv);
    initialTubes = cloneTubes(tubes);
    selected = null;
    moves = 0;
    history = [];
    over = false;
    overlay.classList.remove('show');
    stuckOverlay.classList.remove('show');
    render();
  }

  undoBtn.addEventListener('click', () => {
    if(history.length === 0 || over) return;
    SFX.click();
    const prev = history.pop();
    tubes = prev.tubes;
    moves = prev.moves;
    selected = null;
    over = false;
    stuckOverlay.classList.remove('show');
    render();
  });

  restartBtn.addEventListener('click', () => {
    SFX.click();
    tubes = cloneTubes(initialTubes);
    selected = null;
    moves = 0;
    history = [];
    over = false;
    overlay.classList.remove('show');
    stuckOverlay.classList.remove('show');
    render();
  });

  nextBtn.addEventListener('click', () => {
    SFX.click();
    startLevel(level + 1);
  });

  stuckRestartBtn.addEventListener('click', () => {
    SFX.click();
    tubes = cloneTubes(initialTubes);
    selected = null;
    moves = 0;
    history = [];
    over = false;
    stuckOverlay.classList.remove('show');
    render();
  });

  loadBest();
  startLevel(1);
  applyLang();
})();
</script>
</body>
</html>
