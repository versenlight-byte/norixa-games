<style>
  :root{
    --bg-deep:#120A22; --card:#241640; --card-hi:#2E1B52;

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }

    min-height:100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #35205C 0%, transparent 60%), var(--bg-deep);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif;
    display:flex; flex-direction:column; align-items:center;

  header{ text-align:center; }
  h1{ font-family:'Do Hyeon', sans-serif; font-size:28px; margin:4px 0 0;

  header p{ margin:4px 0 0; color:var(--muted); font-size:12.5px; }

  .ad-slot{
    width:100%; min-height:50px; border:1px dashed rgba(245,240,234,0.22);
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:rgba(245,240,234,0.35); font-size:11px; background:rgba(245,240,234,0.03);
  }

  .score-row{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .lang-row{ display:flex; gap:6px; justify-content:center; }
  .lang-btn{
    padding:6px 12px; border-radius:10px; border:1px solid var(--line);
    background: rgba(245,240,234,0.05); font-size:15px; cursor:pointer; opacity:0.5;
  }
  .lang-btn.active{ opacity:1; background: rgba(45,212,191,0.18); border-color: rgba(45,212,191,0.4); }

  .score-side{ display:flex; flex-direction:column; align-items:center; gap:2px; flex:1; }
  .score-side .lbl{ font-size:11px; color:var(--muted); }
  .score-side .sc{ font-family:'JetBrains Mono', monospace; font-weight:900; font-size:28px; }
  .score-mid{ font-family:'Do Hyeon', sans-serif; font-size:16px; color:var(--amber); }

  .rally-badge{ text-align:center; color:var(--muted); font-size:12.5px; }

  .board-wrap{ position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); background: var(--card); box-shadow: var(--shadow); }
  #gameCanvas{ display:block; width:100%; height:auto; }

  .return-btn{
    border:none; cursor:pointer; border-radius:16px; padding:18px; width:100%;
    background: linear-gradient(135deg, var(--coral), var(--amber)); color:#1B1030;
    font-weight:900; font-size:20px; font-family:'Do Hyeon', sans-serif; letter-spacing:1px;
  }
  .return-btn:active{ transform: scale(0.96); }

  .newgame-btn{ border:none; cursor:pointer; border-radius:12px; padding:10px; width:100%;
    background: rgba(245,240,234,0.08); border:1px solid var(--line); color:var(--muted); font-size:12.5px; }

  .hint{ text-align:center; color:var(--muted); font-size:12.5px; }

  .overlay{
    position:fixed; inset:0; background: rgba(10,6,20,0.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:340px; background: linear-gradient(180deg, var(--card-hi), var(--card));
    border-radius:22px; border:1px solid var(--line); padding:26px 22px 22px; text-align:center;
    transform: translateY(14px) scale(0.96); transition: transform .25s ease; box-shadow: var(--shadow);
  }
  .overlay.show .modal{ transform: translateY(0) scale(1); }
  .modal .emoji{ font-size:40px; margin-bottom:4px; }
  .modal h2{ font-family:'Do Hyeon', sans-serif; font-size:24px; margin:4px 0 10px; }
  .modal .result-line{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13px; margin-bottom:4px; }
  .btn-retry{ margin-top:18px; width:100%; padding:14px; border:none; cursor:pointer; border-radius:14px;
    background: linear-gradient(135deg, var(--teal), var(--amber)); color:#1B1030; font-weight:900; font-size:15px; font-family:'Noto Sans KR', sans-serif; }

  /* ---- shared juice layer (screen fx) ---- */
  @keyframes fxShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .fx-shake{ animation: fxShake .32s ease; }
  .fx-flash-el{ position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0; animation: fxFlashAnim .26s ease; }
  @keyframes fxFlashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }
  .fx-pop{ position:fixed; transform:translate(-50%,-50%); font-family:'JetBrains Mono',monospace; font-weight:900; pointer-events:none; z-index:9999; animation: fxPopAnim .75s ease forwards; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
  @keyframes fxPopAnim{ 0%{transform:translate(-50%,-50%) scale(0.5); opacity:0;} 18%{transform:translate(-50%,-65%) scale(1.2); opacity:1;} 100%{transform:translate(-50%,-160%) scale(1); opacity:0;} }
  button{ transition: transform .08s ease; }
  button:active{ transform:scale(0.93); }
  @media (prefers-reduced-motion: reduce){ .fx-shake, .fx-flash-el, .fx-pop{ animation:none !important; } }
</style>

<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '22px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const myScoreEl = document.getElementById('myScore');
  const oppScoreEl = document.getElementById('oppScore');
  const rallyCountEl = document.getElementById('rallyCount');
  const returnBtn = document.getElementById('returnBtn');
  const overlay = document.getElementById('overlay');

  const WIN_SCORE = 11;
  const IDEAL_T = 0.86;
  const TIERS = [
    { maxErr:50,  labelKey:'tier_perfect', quality:2 },
    { maxErr:150, labelKey:'tier_good',    quality:1 },
    { maxErr:280, labelKey:'tier_weak',    quality:0 },
  ];

  let W, H, scale;
  let myScore, oppScore, rally, over, waiting, ballT, pitchStartTs, pitchDuration, rafId, popup;
  let lastModal = null;

  const LANG = {
    ko: {
      title:'탁구왕 챌린지', subtitle:'타이밍에 맞춰 리턴하세요 · 랠리가 길어질수록 빨라져요',
      label_me:'나', label_opp:'상대', rally_label:'11점 선취 매치 · 랠리',
      btn_return:'리턴!', btn_newgame:'새 게임 시작', btn_retry:'다시 하기',
      hint_controls:'👆 공이 아래로 내려올 때 타이밍 맞춰 탭하세요',
      tier_perfect:'퍼펙트!', tier_good:'좋아요!', tier_weak:'약한 리턴',
      popup_missed:'놓쳤어요!', popup_opp_point:'상대 득점', popup_my_point:'득점! 🏓',
      modal_win_title:'승리!', modal_lose_title:'아쉬운 패배',
      modal_score:(a,b)=>`최종 스코어 ${a} : ${b}`,
    },
    en: {
      title:'Ping Pong King Challenge', subtitle:'Time your returns · Rallies speed up the longer they go',
      label_me:'Me', label_opp:'Opponent', rally_label:'First to 11 · Rally',
      btn_return:'Return!', btn_newgame:'New Game', btn_retry:'Try Again',
      hint_controls:'👆 Tap in time as the ball comes down',
      tier_perfect:'Perfect!', tier_good:'Nice!', tier_weak:'Weak return',
      popup_missed:'Missed!', popup_opp_point:'Opponent scores', popup_my_point:'Point! 🏓',
      modal_win_title:'Victory!', modal_lose_title:'Close Defeat',
      modal_score:(a,b)=>`Final score ${a} : ${b}`,
    },
    es: {
      title:'Desafío de Ping Pong', subtitle:'Sincroniza tus devoluciones · Los rallies se aceleran cuanto más duran',
      label_me:'Yo', label_opp:'Rival', rally_label:'Gana quien llegue a 11 · Rally',
      btn_return:'¡Devolver!', btn_newgame:'Nueva partida', btn_retry:'Reintentar',
      hint_controls:'👆 Toca a tiempo cuando la pelota vaya bajando',
      tier_perfect:'¡Perfecto!', tier_good:'¡Bien!', tier_weak:'Devolución débil',
      popup_missed:'¡Fallaste!', popup_opp_point:'Punto rival', popup_my_point:'¡Punto! 🏓',
      modal_win_title:'¡Victoria!', modal_lose_title:'Derrota ajustada',
      modal_score:(a,b)=>`Marcador final ${a} : ${b}`,
    }
  };
  function currentLang(){ return localStorage.getItem('norixa_lang') || 'ko'; }
  function t(key, ...args){
    const dict = LANG[currentLang()] || LANG.ko;
    const val = dict[key];
    if(typeof val === 'function') return val(...args);
    return val !== undefined ? val : (LANG.ko[key] || key);
  }
  function applyLang(){
    const lang = currentLang();
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('.lang-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.lang === lang); });
    if(lastModal){
      document.getElementById('modalTitle').textContent = lastModal.won ? t('modal_win_title') : t('modal_lose_title');
      document.getElementById('modalScore').textContent = t('modal_score', lastModal.myScore, lastModal.oppScore);
    }
  }
  document.getElementById('langRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if(!btn) return;
    localStorage.setItem('norixa_lang', btn.dataset.lang);
    applyLang();
  });

  function resize(){
    const wrapWidth = canvas.parentElement.clientWidth;
    scale = wrapWidth / 360;
    canvas.width = wrapWidth;
    canvas.height = wrapWidth * (340/360);
    W = canvas.width; H = canvas.height;
  }

  function newGame(){
    myScore = 0; oppScore = 0; rally = 0; over = false; popup = null;
    myScoreEl.textContent = '0'; oppScoreEl.textContent = '0'; rallyCountEl.textContent = '0';
    overlay.classList.remove('show');
    resize();
    startExchange();
  }

  function durationForRally(r){
    return Math.max(420, 1000 - r*55);
  }

  function startExchange(){
    if(over) return;
    waiting = true;
    returnBtn.disabled = false;
    ballT = 0;
    pitchDuration = durationForRally(rally);
    pitchStartTs = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(exchangeLoop);
  }

  function exchangeLoop(ts){
    if(!waiting) return;
    const elapsed = ts - pitchStartTs;
    ballT = elapsed / pitchDuration;
    if(ballT >= 1){
      ballT = 1;
      draw();
      resolveExchange(null); // no tap in time = missed
      return;
    }
    draw();
    rafId = requestAnimationFrame(exchangeLoop);
  }

  function draw(){
    ctx.fillStyle = '#1B1030';
    ctx.fillRect(0,0,W,H);
    // table
    ctx.fillStyle = 'rgba(45,212,191,0.12)';
    ctx.fillRect(20*scale, 20*scale, W-40*scale, H-60*scale);
    // net
    ctx.strokeStyle = 'rgba(245,240,234,0.4)';
    ctx.lineWidth = 2*scale;
    ctx.beginPath();
    ctx.moveTo(20*scale, H/2);
    ctx.lineTo(W-20*scale, H/2);
    ctx.stroke();
    // opponent paddle
    ctx.fillStyle = 'rgba(255,107,74,0.8)';
    ctx.fillRect(W/2-22*scale, 26*scale, 44*scale, 8*scale);
    // player paddle
    ctx.fillStyle = 'rgba(255,194,75,0.9)';
    ctx.fillRect(W/2-22*scale, H-66*scale, 44*scale, 8*scale);

    if(waiting){
      const startY = 40*scale, endY = H-58*scale;
      const y = startY + (endY-startY)*ballT;
      ctx.fillStyle = '#F5F0EA';
      ctx.beginPath();
      ctx.arc(W/2, y, 8*scale, 0, Math.PI*2);
      ctx.fill();
    }

    if(popup){
      ctx.fillStyle = popup.color;
      ctx.font = 'bold ' + (22*scale) + 'px "Do Hyeon", sans-serif';
      ctx.textAlign = 'center';
      ctx.globalAlpha = popup.alpha;
      ctx.fillText(popup.text, W/2, H/2);
      ctx.globalAlpha = 1;
    }
  }

  function fadePopup(){
    let f = 0;
    function step(){
      f++;
      if(popup) popup.alpha = Math.max(0, 1 - f/35);
      if(f < 35){ requestAnimationFrame(step); } else { popup = null; }
    }
    requestAnimationFrame(step);
  }

  function onReturnTap(){
    if(!waiting || over) return;
    resolveExchange(ballT);
  }

  function resolveExchange(tAtTap){
    waiting = false;
    returnBtn.disabled = true;
    cancelAnimationFrame(rafId);

    let tier = null;
    if(tAtTap !== null){
      const errMs = Math.abs(tAtTap - IDEAL_T) * pitchDuration;
      tier = TIERS.find(t => errMs <= t.maxErr) || null;
    }

    if(!tier){
      // missed the return -> opponent wins the point
      oppScore++;
      oppScoreEl.textContent = oppScore;
      rally = 0; rallyCountEl.textContent = '0';
      SFX.wrong(); FX.shake(); FX.vibrate(30);
      popup = { text:t('popup_missed'), alpha:1, color:'#FF6B4A' };
      FX.popText(t('popup_opp_point'), null, null, 'var(--coral)');
      fadePopup(); draw();
      afterPoint();
      return;
    }

    rally++;
    rallyCountEl.textContent = rally;
    SFX.pop();
    popup = { text: t(tier.labelKey), alpha:1, color: tier.quality===2 ? '#FFC24B' : '#2DD4BF' };
    fadePopup(); draw();

    // chance the opponent fails to return, ending the point in the player's favor.
    // longer rallies and better-quality hits make this more likely, like a real rally building pressure.
    const missChance = Math.min(0.65, 0.03*rally + (tier.quality===2 ? 0.12 : 0));
    if(Math.random() < missChance){
      myScore++;
      myScoreEl.textContent = myScore;
      rally = 0; rallyCountEl.textContent = '0';
      SFX.win(); FX.flash('rgba(255,194,75,0.28)'); FX.vibrate([30,25,60]);
      FX.popText(t('popup_my_point'), null, null, 'var(--amber)');
      afterPoint();
    } else {
      setTimeout(startExchange, 500);
    }
  }

  function afterPoint(){
    setTimeout(() => {
      if(myScore >= WIN_SCORE || oppScore >= WIN_SCORE){
        endMatch(myScore > oppScore);
      } else {
        startExchange();
      }
    }, 700);
  }

  function endMatch(won){
    over = true;
    lastModal = { won, myScore, oppScore };
    if(won){
      const wins = parseInt(localStorage.getItem('pingpong_wins') || '0', 10) + 1;
      localStorage.setItem('pingpong_wins', wins);
      SFX.win(); FX.flash('rgba(255,194,75,0.35)');
      document.getElementById('modalEmoji').textContent = '🏆';
      document.getElementById('modalTitle').textContent = t('modal_win_title');
    } else {
      SFX.lose(); FX.shake();
      document.getElementById('modalEmoji').textContent = '😢';
      document.getElementById('modalTitle').textContent = t('modal_lose_title');
    }
    document.getElementById('modalScore').textContent = t('modal_score', myScore, oppScore);
    overlay.classList.add('show');
  }

  returnBtn.addEventListener('click', onReturnTap);
  document.getElementById('retryBtn').addEventListener('click', () => { SFX.click(); newGame(); });
  document.getElementById('newGameBtn').addEventListener('click', () => { SFX.click(); newGame(); });
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', e => { if(e.key === ' '){ e.preventDefault(); onReturnTap(); } });

  newGame();
  applyLang();
})();
</script>
</body>
</html>
