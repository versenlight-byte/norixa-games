<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>카드 짝맞추기 - Norixa</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#120A22">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="같은 그림 카드를 최소 횟수로 찾는 기억력 카드 짝맞추기 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#120A22; --card:#241640; --card-hi:#2E1B52;
    --ink:#F5F0EA; --muted:#A79BC4;
    --coral:#FF6B4A; --teal:#2DD4BF; --amber:#FFC24B;
    --line: rgba(245,240,234,0.10);
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    min-height:100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #35205C 0%, transparent 60%), var(--bg-deep);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
  }
  .wrap{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; }
  a.back{ color:var(--muted); text-decoration:none; font-size:13px; }
  header{ text-align:center; }
  h1{ font-family:'Do Hyeon', sans-serif; font-size:32px; margin:6px 0 0;
      background: linear-gradient(90deg, var(--amber), var(--coral));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ margin:6px 0 0; color:var(--muted); font-size:13.5px; }

  .ad-slot{
    width:100%; min-height:60px; border:1px dashed rgba(245,240,234,0.22);
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:rgba(245,240,234,0.35); font-size:12px; background:rgba(245,240,234,0.03);
  }

  .lang-row{ display:flex; gap:6px; justify-content:center; }
  .lang-btn{
    padding:6px 12px; border-radius:10px; border:1px solid var(--line);
    background: rgba(245,240,234,0.05); font-size:15px; cursor:pointer; opacity:0.5;
  }
  .lang-btn.active{ opacity:1; background: rgba(45,212,191,0.18); border-color: rgba(45,212,191,0.4); }

  .statbar{ display:flex; justify-content:space-between; align-items:center; }
  .stat-box{
    flex:1; text-align:center; padding:8px 6px; border-radius:12px;
    background: rgba(245,240,234,0.06); border:1px solid var(--line); margin-right:8px;
  }
  .stat-box:last-child{ margin-right:0; }
  .stat-box .lbl{ font-size:10.5px; color:var(--muted); }
  .stat-box .val{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:17px; }
  .newgame-btn{
    border:none; cursor:pointer; border-radius:12px; padding:0 16px; height:100%;
    background: linear-gradient(135deg, var(--teal), var(--amber)); color:#1B1030;
    font-weight:900; font-size:13px; font-family:'Noto Sans KR', sans-serif;
  }

  .board{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  }
  .card{
    aspect-ratio:1/1; border-radius:12px; cursor:pointer;
    position:relative; perspective:600px;
  }
  .card-inner{
    width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transition: transform .35s ease;
  }
  .card.flipped .card-inner, .card.matched .card-inner{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; font-size:26px;
  }
  .face.back{
    background: linear-gradient(180deg, var(--card-hi), var(--card));
    border:1px solid var(--line);
  }
  .face.back::after{ content:'?'; color:var(--muted); font-family:'Do Hyeon', sans-serif; font-size:22px; }
  .face.front{
    background: rgba(45,212,191,0.14);
    border:1px solid rgba(45,212,191,0.4);
    transform: rotateY(180deg);
  }
  .card.matched .face.front{
    background: rgba(255,194,75,0.16); border-color: rgba(255,194,75,0.5);
  }

  .overlay{
    position:fixed; inset:0; background: rgba(10,6,20,0.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:360px;
    background: linear-gradient(180deg, var(--card-hi), var(--card));
    border-radius:22px; border:1px solid var(--line);
    padding:28px 24px 24px; text-align:center;
    transform: translateY(14px) scale(0.96); transition: transform .25s ease;
    box-shadow: var(--shadow);
  }
  .overlay.show .modal{ transform: translateY(0) scale(1); }
  .modal .emoji{ font-size:44px; margin-bottom:6px; }
  .modal h2{ font-family:'Do Hyeon', sans-serif; font-size:26px; margin:4px 0 12px; }
  .modal .result-line{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13.5px; margin-bottom:4px; }
  .btn-retry{
    margin-top:20px; width:100%; padding:15px; border:none; cursor:pointer;
    border-radius:14px; background: linear-gradient(135deg, var(--teal), var(--amber));
    color:#1B1030; font-weight:900; font-size:16px; font-family:'Noto Sans KR', sans-serif;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* ---- shared juice layer (screen fx) ---- */
  @keyframes fxShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .fx-shake{ animation: fxShake .32s ease; }
  .fx-flash-el{ position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0; animation: fxFlashAnim .26s ease; }
  @keyframes fxFlashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }
  .fx-pop{ position:fixed; transform:translate(-50%,-50%); font-family:'JetBrains Mono',monospace; font-weight:900; pointer-events:none; z-index:9999; animation: fxPopAnim .75s ease forwards; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
  @keyframes fxPopAnim{ 0%{transform:translate(-50%,-50%) scale(0.5); opacity:0;} 18%{transform:translate(-50%,-65%) scale(1.2); opacity:1;} 100%{transform:translate(-50%,-160%) scale(1); opacity:0;} }
  button{ transition: transform .08s ease; }
  button:active{ transform:scale(0.93); }
  @media (prefers-reduced-motion: reduce){ .fx-shake, .fx-flash-el, .fx-pop{ animation:none !important; } }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4196209515730511"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← 게임 목록으로</a>
  <header>
    <h1 data-i18n="title">카드 짝맞추기</h1>
    <p data-i18n="subtitle">같은 그림 카드 8쌍을 최소 횟수로 찾아보세요</p>
  </header>

  <div class="lang-row" id="langRow">
    <button class="lang-btn" data-lang="ko">🇰🇷</button>
    <button class="lang-btn" data-lang="en">🇺🇸</button>
    <button class="lang-btn" data-lang="es">🇪🇸</button>
  </div>

  <ins class="adsbygoogle ad-slot"
       style="display:block"
       data-ad-client="ca-pub-4196209515730511"
       data-ad-slot="REPLACE_WITH_AD_SLOT_ID"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div class="statbar">
    <div class="stat-box"><div class="lbl" data-i18n="stat_moves">시도</div><div class="val" id="moves">0</div></div>
    <div class="stat-box"><div class="lbl" data-i18n="stat_time">시간</div><div class="val" id="timer">0:00</div></div>
    <div class="stat-box"><div class="lbl" data-i18n="stat_best">최고 기록</div><div class="val" id="best">-</div></div>
    <button class="newgame-btn" id="newGameBtn" data-i18n="btn_newgame">새 게임</button>
  </div>

  <div class="board" id="board"></div>

  <ins class="adsbygoogle ad-slot"
       style="display:block"
       data-ad-client="ca-pub-4196209515730511"
       data-ad-slot="REPLACE_WITH_AD_SLOT_ID"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div style="margin-top:4px;"><p style="text-align:center;color:var(--muted);font-size:12px;margin:0 0 8px;">🎮 다른 게임도 해보세요</p><div style="display:flex;gap:8px;flex-wrap:wrap;"><a href="blocks.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">🧱<br><span style="font-size:11.5px;">블록 챌린지</span></a><a href="omok.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">⚫<br><span style="font-size:11.5px;">오목</span></a><a href="worldcup.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">⚽<br><span style="font-size:11.5px;">2026북중미월드컵</span></a></div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="emoji">🎉</div>
    <h2 data-i18n="modal_title">클리어!</h2>
    <div class="result-line" id="modalLine1">시도 0회</div>
    <div class="result-line" id="modalLine2">시간 0:00</div>
    <button class="btn-retry" id="retryBtn" data-i18n="btn_retry">다시 하기</button>
  </div>
</div>

<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '22px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const EMOJIS = ['🍎','🍋','🍇','🍓','🍑','🥝','🍒','🍉'];
  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const retryBtn = document.getElementById('retryBtn');
  const newGameBtn = document.getElementById('newGameBtn');

  let cards, flipped, matchedCount, moves, seconds, timerId, locked;
  let gameId = 0;
  let lastModal = null;

  const LANG = {
    ko: {
      title:'카드 짝맞추기', subtitle:'같은 그림 카드 8쌍을 최소 횟수로 찾아보세요',
      stat_moves:'시도', stat_time:'시간', stat_best:'최고 기록', btn_newgame:'새 게임', btn_retry:'다시 하기',
      modal_title:'클리어!',
      modal_moves:(m)=>`시도 ${m}회`, modal_time:(s)=>`시간 ${s}`,
    },
    en: {
      title:'Memory Match', subtitle:'Find all 8 matching card pairs in as few tries as possible',
      stat_moves:'Moves', stat_time:'Time', stat_best:'Best', btn_newgame:'New Game', btn_retry:'Try Again',
      modal_title:'Cleared!',
      modal_moves:(m)=>`${m} moves`, modal_time:(s)=>`Time ${s}`,
    },
    es: {
      title:'Memoria de Cartas', subtitle:'Encuentra las 8 parejas con el menor número de intentos',
      stat_moves:'Intentos', stat_time:'Tiempo', stat_best:'Mejor', btn_newgame:'Nueva partida', btn_retry:'Reintentar',
      modal_title:'¡Completado!',
      modal_moves:(m)=>`${m} intentos`, modal_time:(s)=>`Tiempo ${s}`,
    }
  };
  function currentLang(){ return localStorage.getItem('norixa_lang') || 'ko'; }
  function t(key, ...args){
    const dict = LANG[currentLang()] || LANG.ko;
    const val = dict[key];
    if(typeof val === 'function') return val(...args);
    return val !== undefined ? val : (LANG.ko[key] || key);
  }
  function applyLang(){
    const lang = currentLang();
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('.lang-btn').forEach(btn => { btn.classList.toggle('active', btn.dataset.lang === lang); });
    if(lastModal){
      document.getElementById('modalLine1').textContent = t('modal_moves', lastModal.moves);
      document.getElementById('modalLine2').textContent = t('modal_time', formatTime(lastModal.seconds));
    }
  }
  document.getElementById('langRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if(!btn) return;
    localStorage.setItem('norixa_lang', btn.dataset.lang);
    applyLang();
  });

  function loadBest(){
    const b = localStorage.getItem('memory_best_moves');
    bestEl.textContent = b ? b + '회' : '-';
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function formatTime(s){
    const m = Math.floor(s/60);
    const sec = s%60;
    return m + ':' + String(sec).padStart(2,'0');
  }

  function newGame(){
    gameId++;
    cards = shuffle([...EMOJIS, ...EMOJIS]);
    flipped = []; matchedCount = 0; moves = 0; seconds = 0; locked = false;
    movesEl.textContent = '0';
    timerEl.textContent = '0:00';
    overlay.classList.remove('show');
    clearInterval(timerId);
    timerId = setInterval(()=>{ seconds++; timerEl.textContent = formatTime(seconds); }, 1000);
    render();
  }

  function render(){
    boardEl.innerHTML = '';
    cards.forEach((emoji, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.idx = idx;
      card.innerHTML = '<div class="card-inner"><div class="face back"></div><div class="face front">' + emoji + '</div></div>';
      card.addEventListener('click', () => onCardClick(idx, card));
      boardEl.appendChild(card);
    });
  }

  function onCardClick(idx, el){
    if(locked) return;
    if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
    if(flipped.length >= 2) return;

    el.classList.add('flipped');
    SFX.click();
    flipped.push({ idx, el });

    if(flipped.length === 2){
      moves++;
      movesEl.textContent = moves;
      locked = true;
      const [a,b] = flipped;
      const myGameId = gameId;
      if(cards[a.idx] === cards[b.idx]){
        SFX.correct(); FX.flash('rgba(45,212,191,0.22)'); FX.vibrate(14);
        setTimeout(()=>{
          if(myGameId !== gameId) return; // 그 사이 새 게임이 시작됐으면 이 결과는 버려요
          a.el.classList.add('matched');
          b.el.classList.add('matched');
          matchedCount += 2;
          flipped = [];
          locked = false;
          if(matchedCount === cards.length) finish();
        }, 350);
      } else {
        SFX.wrong(); FX.shake(); FX.vibrate(30);
        setTimeout(()=>{
          if(myGameId !== gameId) return; // 그 사이 새 게임이 시작됐으면 이 결과는 버려요
          a.el.classList.remove('flipped');
          b.el.classList.remove('flipped');
          flipped = [];
          locked = false;
        }, 700);
      }
    }
  }

  function finish(){
    SFX.win(); FX.flash('rgba(255,194,75,0.32)'); FX.vibrate([35,30,70]);
    clearInterval(timerId);
    const prevBest = parseInt(localStorage.getItem('memory_best_moves') || '9999', 10);
    if(moves < prevBest) localStorage.setItem('memory_best_moves', moves);
    loadBest();

    lastModal = { moves, seconds };
    document.getElementById('modalLine1').textContent = t('modal_moves', moves);
    document.getElementById('modalLine2').textContent = t('modal_time', formatTime(seconds));
    overlay.classList.add('show');
  }

  retryBtn.addEventListener('click', newGame);
  newGameBtn.addEventListener('click', newGame);

  loadBest();
  applyLang();
  newGame();
})();
</script>
</body>
</html>
