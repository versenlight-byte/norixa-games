<html lang="ko">

<meta name="description" content="AI를 상대로 먼저 5개를 연결하면 이기는 오목 게임. 9x9 미니 보드로 빠르게 즐겨보세요.">

<style>
  :root{
    --bg-deep:#120A22; --card:#241640; --card-hi:#2E1B52;
    --ink:#F5F0EA; --muted:#A79BC4;
    --coral:#FF6B4A; --teal:#2DD4BF; --amber:#FFC24B;
    --line: rgba(245,240,234,0.10);
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    min-height:100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #35205C 0%, transparent 60%), var(--bg-deep);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
    touch-action: manipulation;
  }
  .wrap{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; }
  a.back{ color:var(--muted); text-decoration:none; font-size:13px; }
  header{ text-align:center; }
  h1{ font-family:'Do Hyeon', sans-serif; font-size:32px; margin:6px 0 0;
      background: linear-gradient(90deg, var(--ink), var(--muted));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ margin:6px 0 0; color:var(--muted); font-size:13.5px; }

  .ad-slot{
    width:100%; min-height:60px; border:1px dashed rgba(245,240,234,0.22);
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:rgba(245,240,234,0.35); font-size:12px; background:rgba(245,240,234,0.03);
  }

  .statbar{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .stat-box{
    flex:1; text-align:center; padding:8px 6px; border-radius:12px;
    background: rgba(245,240,234,0.06); border:1px solid var(--line);
  }
  .stat-box .lbl{ font-size:10.5px; color:var(--muted); }
  .stat-box .val{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px; }
  .newgame-btn{
    border:none; cursor:pointer; border-radius:12px; padding:0 16px; height:100%; min-height:44px;
    background: linear-gradient(135deg, var(--coral), var(--amber)); color:#1B1030;
    font-weight:900; font-size:13px; font-family:'Noto Sans KR', sans-serif;
  }

  .diff-row{ display:flex; gap:6px; }
  .diff-btn{
    flex:1; padding:9px 0; border-radius:12px; border:1px solid var(--line);
    background: rgba(245,240,234,0.05); color:var(--muted); font-size:13px; font-weight:700;
    font-family:'Noto Sans KR', sans-serif; cursor:pointer;
  }
  .diff-btn.active{ background: linear-gradient(135deg, var(--teal), var(--amber)); color:#1B1030; border-color:transparent; }

  .turn-badge{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:13px; color:var(--muted); padding:6px;
  }
  .turn-dot{ width:14px; height:14px; border-radius:50%; }
  .turn-dot.black{ background: radial-gradient(circle at 35% 30%, #555, #0a0a0a); }
  .turn-dot.white{ background: radial-gradient(circle at 35% 30%, #fff, #cfcfcf); }

  .board{
    position:relative; width:100%; aspect-ratio:1/1;
    background: linear-gradient(160deg, #C9A66B, #A9814A);
    border-radius:14px; padding:6px;
    display:grid; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr);
    gap:2px; box-shadow: var(--shadow); border:1px solid var(--line);
  }
  .cell{
    background: rgba(0,0,0,0.06); border-radius:3px; position:relative;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .stone{
    width:82%; height:82%; border-radius:50%; pointer-events:none;
    animation: pop .15s ease;
  }
  .stone.black{ background: radial-gradient(circle at 35% 30%, #555, #0a0a0a); box-shadow:0 2px 3px rgba(0,0,0,0.5); }
  .stone.white{ background: radial-gradient(circle at 35% 30%, #fff, #cfcfcf); box-shadow:0 2px 3px rgba(0,0,0,0.4); }
  .cell.win .stone{ box-shadow: 0 0 0 2px var(--teal), 0 2px 6px rgba(0,0,0,0.5); }
  @keyframes pop{ 0%{ transform:scale(0.5); } 100%{ transform:scale(1); } }

  .hint{ text-align:center; color:var(--muted); font-size:12.5px; }

  .overlay{
    position:fixed; inset:0; background: rgba(10,6,20,0.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:360px;
    background: linear-gradient(180deg, var(--card-hi), var(--card));
    border-radius:22px; border:1px solid var(--line);
    padding:28px 24px 24px; text-align:center;
    transform: translateY(14px) scale(0.96); transition: transform .25s ease;
    box-shadow: var(--shadow);
  }
  .overlay.show .modal{ transform: translateY(0) scale(1); }
  .modal .emoji{ font-size:44px; margin-bottom:6px; }
  .modal h2{ font-family:'Do Hyeon', sans-serif; font-size:26px; margin:4px 0 12px; }
  .modal .result-line{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13.5px; margin-bottom:4px; }
  .btn-retry{
    margin-top:20px; width:100%; padding:15px; border:none; cursor:pointer;
    border-radius:14px; background: linear-gradient(135deg, var(--teal), var(--amber));
    color:#1B1030; font-weight:900; font-size:16px; font-family:'Noto Sans KR', sans-serif;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  /* ---- shared juice layer (screen fx) ---- */
  @keyframes fxShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .fx-shake{ animation: fxShake .32s ease; }
  .fx-flash-el{ position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0; animation: fxFlashAnim .26s ease; }
  @keyframes fxFlashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }
  .fx-pop{ position:fixed; transform:translate(-50%,-50%); font-family:'JetBrains Mono',monospace; font-weight:900; pointer-events:none; z-index:9999; animation: fxPopAnim .75s ease forwards; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
  @keyframes fxPopAnim{ 0%{transform:translate(-50%,-50%) scale(0.5); opacity:0;} 18%{transform:translate(-50%,-65%) scale(1.2); opacity:1;} 100%{transform:translate(-50%,-160%) scale(1); opacity:0;} }
  button{ transition: transform .08s ease; }
  button:active{ transform:scale(0.93); }
  @media (prefers-reduced-motion: reduce){ .fx-shake, .fx-flash-el, .fx-pop{ animation:none !important; } }
</style>

<body>
<div class="wrap">
  <a class="back" href="../index.html">← 게임 목록으로</a>
  <header>
    <h1>오목</h1>
    <p>먼저 5개를 연결하면 승리! AI를 상대로 대결하세요</p>
  </header>

  <ins class="adsbygoogle ad-slot"
       style="display:block"
       data-ad-client="ca-pub-4196209515730511"
       data-ad-slot="REPLACE_WITH_AD_SLOT_ID"

  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div class="diff-row" id="diffRow">
    <button class="diff-btn" data-diff="easy">쉬움</button>
    <button class="diff-btn" data-diff="normal">보통</button>
    <button class="diff-btn" data-diff="hard">어려움</button>
  </div>

  <div class="statbar">
    <div class="stat-box"><div class="lbl">승</div><div class="val" id="winCount">0</div></div>
    <div class="stat-box"><div class="lbl">패</div><div class="val" id="loseCount">0</div></div>
    <button class="newgame-btn" id="newGameBtn">새 게임</button>
  </div>
  <div class="turn-badge" id="turnBadge"><span class="turn-dot black"></span><span>당신 차례 (흑돌)</span></div>

  <div class="board" id="board"></div>
  <div class="hint">👆 칸을 탭해서 돌을 놓으세요 · 당신은 흑돌, AI는 백돌</div>

  <ins class="adsbygoogle ad-slot"
       style="display:block"
       data-ad-client="ca-pub-4196209515730511"

       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div style="margin-top:4px;"><p style="text-align:center;color:var(--muted);font-size:12px;margin:0 0 8px;">🎮 다른 게임도 해보세요</p><div style="display:flex;gap:8px;flex-wrap:wrap;"><a href="minesweeper.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">💣<br><span style="font-size:11.5px;">지뢰찾기</span></a><a href="puzzle.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">🧩<br><span style="font-size:11.5px;">2048</span></a><a href="wordchain.html" style="flex:1;min-width:90px;text-align:center;background:rgba(245,240,234,0.06);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-decoration:none;color:var(--ink);font-size:12px;">🗣️<br><span style="font-size:11.5px;">끝말잇기</span></a></div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="emoji" id="modalEmoji">🎉</div>
    <h2 id="modalTitle">승리!</h2>
    <div class="result-line" id="modalLine">흑돌이 5개를 연결했어요</div>
    <button class="btn-retry" id="retryBtn">다시 하기</button>
  </div>
</div>

<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '22px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const SIZE = 9;
  const EMPTY=0, BLACK=1, WHITE=2;
  const boardEl = document.getElementById('board');
  const overlay = document.getElementById('overlay');
  const retryBtn = document.getElementById('retryBtn');
  const newGameBtn = document.getElementById('newGameBtn');
  const turnBadge = document.getElementById('turnBadge');
  const winCountEl = document.getElementById('winCount');
  const loseCountEl = document.getElementById('loseCount');

  let grid, over, cells;
  let difficulty = localStorage.getItem('omok_difficulty') || 'normal';

  const diffRow = document.getElementById('diffRow');
  function renderDiffButtons(){
    [...diffRow.children].forEach(btn => {
      btn.classList.toggle('active', btn.dataset.diff === difficulty);
    });
  }
  diffRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.diff-btn');
    if(!btn) return;
    SFX.click();
    difficulty = btn.dataset.diff;
    localStorage.setItem('omok_difficulty', difficulty);
    renderDiffButtons();
    newGame();
  });
  renderDiffButtons();

  function loadStats(){
    winCountEl.textContent = localStorage.getItem('omok_wins') || '0';
    loseCountEl.textContent = localStorage.getItem('omok_losses') || '0';
  }

  function newGame(){
    grid = Array.from({length:SIZE}, ()=>Array(SIZE).fill(EMPTY));
    over = false;
    overlay.classList.remove('show');
    setTurnBadge(true);
    render();
  }

  function setTurnBadge(playerTurn){
    turnBadge.innerHTML = playerTurn
      ? '<span class="turn-dot black"></span><span>당신 차례 (흑돌)</span>'
      : '<span class="turn-dot white"></span><span>AI 생각 중... (백돌)</span>';
  }

  function render(winLine){
    boardEl.innerHTML = '';
    cells = [];
    const winSet = new Set((winLine||[]).map(([r,c])=>r+'_'+c));
    for(let r=0;r<SIZE;r++){
      cells.push([]);
      for(let c=0;c<SIZE;c++){
        const cell = document.createElement('div');
        cell.className = 'cell' + (winSet.has(r+'_'+c) ? ' win' : '');
        if(grid[r][c] !== EMPTY){
          const stone = document.createElement('div');
          stone.className = 'stone ' + (grid[r][c]===BLACK ? 'black' : 'white');
          cell.appendChild(stone);
        } else {
          cell.addEventListener('click', () => onCellClick(r,c));
        }
        boardEl.appendChild(cell);
        cells[r].push(cell);
      }
    }
  }

  function inBounds(r,c){ return r>=0 && r<SIZE && c>=0 && c<SIZE; }

  const DIRS = [[1,0],[0,1],[1,1],[1,-1]];

  function findWinLine(r,c,player){
    for(const [dr,dc] of DIRS){
      let line = [[r,c]];
      let rr=r+dr, cc=c+dc;
      while(inBounds(rr,cc) && grid[rr][cc]===player){ line.push([rr,cc]); rr+=dr; cc+=dc; }
      rr=r-dr; cc=c-dc;
      while(inBounds(rr,cc) && grid[rr][cc]===player){ line.unshift([rr,cc]); rr-=dr; cc-=dc; }
      if(line.length >= 5) return line.slice(0,5);
    }
    return null;
  }

  function evalCell(r,c,player){
    let best = 0;
    for(const [dr,dc] of DIRS){
      let rr=r+dr, cc=c+dc, fwd=0;
      while(inBounds(rr,cc) && grid[rr][cc]===player){ fwd++; rr+=dr; cc+=dc; }
      const fwdOpen = inBounds(rr,cc) && grid[rr][cc]===EMPTY;
      rr=r-dr; cc=c-dc; let bwd=0;
      while(inBounds(rr,cc) && grid[rr][cc]===player){ bwd++; rr-=dr; cc-=dc; }
      const bwdOpen = inBounds(rr,cc) && grid[rr][cc]===EMPTY;
      const count = 1+fwd+bwd;
      const openEnds = (fwdOpen?1:0)+(bwdOpen?1:0);
      let score = 0;
      if(count>=5) score = 100000;
      else if(count===4) score = openEnds===2 ? 10000 : (openEnds===1 ? 1000 : 0);
      else if(count===3) score = openEnds===2 ? 500 : (openEnds===1 ? 100 : 0);
      else if(count===2) score = openEnds===2 ? 50 : (openEnds===1 ? 10 : 0);
      else score = openEnds===2 ? 5 : 1;
      if(score > best) best = score;
    }
    return best;
  }

  function aiMove(){
    // 쉬움: 가끔 완전히 랜덤한 수를 둬서 초보자도 이길 기회를 줘요.
    if(difficulty === 'easy' && Math.random() < 0.35){
      const empties = [];
      for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(grid[r][c]===EMPTY) empties.push([r,c]);
      if(empties.length) return empties[Math.floor(Math.random()*empties.length)];
    }
    const defWeight = difficulty === 'hard' ? 1.15 : difficulty === 'easy' ? 0.45 : 0.9;
    const noise = difficulty === 'easy' ? 140 : difficulty === 'hard' ? 0 : 0;

    let bestScore = -1, bestMoves = [];
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        if(grid[r][c] !== EMPTY) continue;
        const off = evalCell(r,c,WHITE);
        const def = evalCell(r,c,BLACK);
        const centerBias = 3 - (Math.abs(r-4)+Math.abs(c-4))*0.05;
        const total = off + def*defWeight + centerBias + (noise ? Math.random()*noise : 0);
        if(total > bestScore + 1e-6){ bestScore = total; bestMoves = [[r,c]]; }
        else if(Math.abs(total-bestScore) < 1e-6){ bestMoves.push([r,c]); }
      }
    }
    if(bestMoves.length === 0) return null;
    // 어려움은 동점 후보 중에서도 흔들림 없이 항상 같은 최적수를 선택해요 (랜덤성 최소화)
    if(difficulty === 'hard') return bestMoves[0];
    return bestMoves[Math.floor(Math.random()*bestMoves.length)];
  }

  function onCellClick(r,c){
    if(over || grid[r][c] !== EMPTY) return;
    SFX.click();
    grid[r][c] = BLACK;
    render();
    const winLine = findWinLine(r,c,BLACK);
    if(winLine){ endGame(true, winLine); return; }
    if(isBoardFull()){ endGame(null); return; }

    setTurnBadge(false);
    over = true; // lock input while AI thinks
    setTimeout(() => {
      const move = aiMove();
      over = false;
      if(move){
        const [ar,ac] = move;
        grid[ar][ac] = WHITE;
        const aiWin = findWinLine(ar,ac,WHITE);
        render(aiWin);
        if(aiWin){ endGame(false, aiWin); return; }
        if(isBoardFull()){ endGame(null); return; }
      }
      setTurnBadge(true);
    }, 380);
  }

  function isBoardFull(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(grid[r][c]===EMPTY) return false;
    return true;
  }

  function endGame(playerWon, winLine){
    over = true;
    if(winLine) render(winLine);
    let wins = parseInt(localStorage.getItem('omok_wins')||'0',10);
    let losses = parseInt(localStorage.getItem('omok_losses')||'0',10);
    if(playerWon === true){
      SFX.win(); FX.flash('rgba(255,194,75,0.32)'); FX.vibrate([35,30,70]);
      wins++; localStorage.setItem('omok_wins', wins);
      document.getElementById('modalEmoji').textContent = '🎉';
      document.getElementById('modalTitle').textContent = '승리!';
      document.getElementById('modalLine').textContent = '흑돌이 5개를 연결했어요';
    } else if(playerWon === false){
      SFX.lose(); FX.shake(); FX.vibrate([70,40,70]);
      losses++; localStorage.setItem('omok_losses', losses);
      document.getElementById('modalEmoji').textContent = '😵';
      document.getElementById('modalTitle').textContent = '패배...';
      document.getElementById('modalLine').textContent = 'AI(백돌)가 먼저 연결했어요';
    } else {
      document.getElementById('modalEmoji').textContent = '🤝';
      document.getElementById('modalTitle').textContent = '무승부';
      document.getElementById('modalLine').textContent = '보드가 가득 찼어요';
    }
    loadStats();
    overlay.classList.add('show');
  }

  retryBtn.addEventListener('click', newGame);
  newGameBtn.addEventListener('click', newGame);

  loadStats();
  newGame();
})();
</script>
