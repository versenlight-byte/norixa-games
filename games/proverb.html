<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '22px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const PROVERBS = [

    ["하늘이 무너져도", "솟아날 구멍이 있다"],

    ["돌다리도 두들겨 보고", "건너라"],

    ["자라 보고 놀란 가슴", "솥뚜껑 보고 놀란다"],
    ["절이 싫으면", "중이 떠나라"],

    ["첫술에", "배부르랴"],
    ["팔이", "안으로 굽는다"],
    ["핑계 없는", "무덤 없다"],
    ["하룻강아지", "범 무서운 줄 모른다"],
    ["호랑이에게 물려가도", "정신만 차리면 산다"],
    ["구슬이 서 말이라도", "꿰어야 보배"],
    ["낙숫물이", "댓돌을 뚫는다"],
    ["내 코가", "석 자"],
    ["달도 차면", "기운다"],
    ["물이 깊어야", "고기가 모인다"],
    ["뿌린 대로", "거둔다"],
    ["산 넘어", "산"],
    ["새 발의", "피"],
    ["서울 가서", "김서방 찾기"],
    ["손바닥으로", "하늘 가리기"],
    ["쇠뿔도", "단김에 빼라"],
    ["십 년이면", "강산도 변한다"],
    ["아는 길도", "물어 가라"],
    ["언 발에", "오줌 누기"],
    ["오르지 못할 나무는", "쳐다보지도 마라"],
    ["우물에 가", "숭늉 찾는다"],
    ["입술이 없으면", "이가 시리다"],
    ["하늘의", "별 따기"]
  ];

  const qText = document.getElementById('qText');
  const choicesEl = document.getElementById('choices');
  const qNumEl = document.getElementById('qNum');
  const correctCountEl = document.getElementById('correctCount');
  const bestEl = document.getElementById('best');
  const timebar = document.getElementById('timebar');
  const overlay = document.getElementById('overlay');

  const TOTAL_Q = 10;
  const Q_SECONDS = 10;
  let order, qIndex, correctCount, timerId, timeLeft, locked, streak;

  function loadBest(){ bestEl.textContent = localStorage.getItem('proverb_best') || '0'; }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function newGame(){
    order = shuffle([...Array(PROVERBS.length).keys()]).slice(0, TOTAL_Q);
    qIndex = 0; correctCount = 0; streak = 0; locked = false;
    correctCountEl.textContent = '0';
    overlay.classList.remove('show');
    loadBest();
    showQuestion();
  }

  function showQuestion(){
    locked = false;
    qNumEl.textContent = qIndex+1;
    const idx = order[qIndex];
    const [front, answer] = PROVERBS[idx];
    qText.textContent = front + ' ___';

    const distractorPool = PROVERBS.filter((_,i)=> i !== idx).map(p=>p[1]);
    const distractors = shuffle(distractorPool).slice(0,3);
    const choices = shuffle([answer, ...distractors]);

    choicesEl.innerHTML = '';
    choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = choice;
      btn.addEventListener('click', ()=> selectAnswer(btn, choice, answer));
      choicesEl.appendChild(btn);
    });

    startTimer();
  }

  function startTimer(){
    clearInterval(timerId);
    timeLeft = Q_SECONDS;
    timebar.style.transform = 'scaleX(1)';
    timerId = setInterval(()=>{
      timeLeft--;
      timebar.style.transform = 'scaleX(' + Math.max(timeLeft,0)/Q_SECONDS + ')';
      if(timeLeft <= 0){
        clearInterval(timerId);
        if(!locked) selectAnswer(null, null, PROVERBS[order[qIndex]][1]);
      }
    }, 1000);
  }

  function selectAnswer(btn, choice, answer){
    if(locked) return;
    locked = true;
    clearInterval(timerId);
    const buttons = [...choicesEl.children];
    buttons.forEach(b => {
      b.classList.add('disabled');
      if(b.textContent === answer) b.classList.add('correct');
    });
    if(choice === answer){
      SFX.correct(); FX.flash('rgba(45,212,191,0.22)'); FX.vibrate(14);
      correctCount++;
      streak++;
      correctCountEl.textContent = correctCount;
      if(streak >= 3){ FX.popText(streak + '연속 정답! 🔥', null, null, 'var(--amber)'); }
    } else {
      SFX.wrong(); FX.shake(); FX.vibrate(30);
      streak = 0;
      if(btn) btn.classList.add('wrong');
    }
    setTimeout(()=>{
      qIndex++;
      if(qIndex >= TOTAL_Q){ finish(); } else { showQuestion(); }
    }, 900);
  }

  function finish(){
    SFX.win(); FX.flash('rgba(255,194,75,0.32)'); FX.vibrate([35,30,70]);
    const best = parseInt(localStorage.getItem('proverb_best') || '0', 10);
    if(correctCount > best) localStorage.setItem('proverb_best', correctCount);
    loadBest();
    document.getElementById('modalScore').textContent = TOTAL_Q + '문제 중 ' + correctCount + '개 정답';
    overlay.classList.add('show');
  }

  document.getElementById('retryBtn').addEventListener('click', newGame);

  newGame();
