<style>
  :root{
    --bg-deep:#120A22; --card:#241640; --card-hi:#2E1B52;
    --ink:#F5F0EA; --muted:#A79BC4;
    --coral:#FF6B4A; --teal:#2DD4BF; --amber:#FFC24B; --purple:#8B7CF6;
    --line: rgba(245,240,234,0.10);
    --shadow: 0 20px 50px rgba(0,0,0,0.45);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    min-height:100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #35205C 0%, transparent 60%), var(--bg-deep);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
    touch-action: none;
  }
  .wrap{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; }
  a.back{ color:var(--muted); text-decoration:none; font-size:13px; }
  header{ text-align:center; }
  h1{ font-family:'Do Hyeon', sans-serif; font-size:32px; margin:6px 0 0;
      background: linear-gradient(90deg, var(--purple), var(--teal));
      -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ margin:6px 0 0; color:var(--muted); font-size:13.5px; }

  .ad-slot{
    width:100%; min-height:60px; border:1px dashed rgba(245,240,234,0.22);
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    color:rgba(245,240,234,0.35); font-size:12px; background:rgba(245,240,234,0.03);
  }

  .statbar{ display:flex; justify-content:space-between; align-items:center; }
  .stat-box{
    flex:1; text-align:center; padding:8px 6px; border-radius:12px;
    background: rgba(245,240,234,0.06); border:1px solid var(--line); margin-right:8px;
  }
  .stat-box:last-child{ margin-right:0; }
  .stat-box .lbl{ font-size:10.5px; color:var(--muted); }
  .stat-box .val{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:17px; }
  .newgame-btn{
    border:none; cursor:pointer; border-radius:12px; padding:0 16px; height:100%;
    background: linear-gradient(135deg, var(--coral), var(--amber)); color:#1B1030;
    font-weight:900; font-size:13px; font-family:'Noto Sans KR', sans-serif;
  }

  .board{
    position:relative; width:100%; aspect-ratio:1/1;
    background: var(--card); border-radius:16px; padding:8px;
    display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);
    gap:8px; box-shadow: var(--shadow); border:1px solid var(--line);
  }
  .cell{ background: rgba(245,240,234,0.05); border-radius:10px; }
  .tile{
    position:absolute; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-weight:700;
    transition: top .12s ease, left .12s ease, transform .12s ease;
  }
  .tile.pop{ animation: pop .15s ease; }
  @keyframes pop{ 0%{ transform:scale(0.6); } 100%{ transform:scale(1); } }

  .hint{ text-align:center; color:var(--muted); font-size:12.5px; }

  .overlay{
    position:fixed; inset:0; background: rgba(10,6,20,0.72); backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .25s ease; z-index:10;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:360px;
    background: linear-gradient(180deg, var(--card-hi), var(--card));
    border-radius:22px; border:1px solid var(--line);
    padding:28px 24px 24px; text-align:center;
    transform: translateY(14px) scale(0.96); transition: transform .25s ease;
    box-shadow: var(--shadow);
  }
  .overlay.show .modal{ transform: translateY(0) scale(1); }
  .modal .emoji{ font-size:44px; margin-bottom:6px; }
  .modal h2{ font-family:'Do Hyeon', sans-serif; font-size:26px; margin:4px 0 12px; }
  .modal .result-line{ font-family:'JetBrains Mono', monospace; color:var(--muted); font-size:13.5px; margin-bottom:4px; }
  .btn-retry{
    margin-top:20px; width:100%; padding:15px; border:none; cursor:pointer;
    border-radius:14px; background: linear-gradient(135deg, var(--teal), var(--amber));
    color:#1B1030; font-weight:900; font-size:16px; font-family:'Noto Sans KR', sans-serif;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  /* ---- shared juice layer (screen fx) ---- */
  @keyframes fxShake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(7px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  .fx-shake{ animation: fxShake .32s ease; }
  .fx-flash-el{ position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0; animation: fxFlashAnim .26s ease; }
  @keyframes fxFlashAnim{ 0%{opacity:0.85;} 100%{opacity:0;} }
  .fx-pop{ position:fixed; transform:translate(-50%,-50%); font-family:'JetBrains Mono',monospace; font-weight:900; pointer-events:none; z-index:9999; animation: fxPopAnim .75s ease forwards; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
  @keyframes fxPopAnim{ 0%{transform:translate(-50%,-50%) scale(0.5); opacity:0;} 18%{transform:translate(-50%,-65%) scale(1.2); opacity:1;} 100%{transform:translate(-50%,-160%) scale(1); opacity:0;} }
  button{ transition: transform .08s ease; }
  button:active{ transform:scale(0.93); }
  @media (prefers-reduced-motion: reduce){ .fx-shake, .fx-flash-el, .fx-pop{ animation:none !important; } }
</style>

<body>

<div class="overlay show" id="tutorialOverlay">
  <div class="modal">
    <div class="emoji">🧩</div>
    <h2>2048 하는 법</h2>
    <div class="result-line" style="margin-bottom:16px; line-height:1.6;">
      화면을 <b style="color:var(--teal);">스와이프</b>하면 보드의 모든 타일이 그 방향으로 <b style="color:var(--teal);">한꺼번에</b> 밀려요.<br><br>
      <b style="color:var(--amber);">같은 숫자</b>끼리 부딪히면 하나로 합쳐지면서 숫자가 <b style="color:var(--amber);">2배</b>가 돼요.
    </div>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px;">
      <div style="width:44px;height:44px;border-radius:10px;background:#3a2b57;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:900;font-size:18px;">2</div>
      <div style="width:44px;height:44px;border-radius:10px;background:#3a2b57;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:900;font-size:18px;">2</div>
      <div style="color:var(--muted); font-size:18px;">→</div>
      <div style="width:44px;height:44px;border-radius:10px;background:var(--amber);color:#1B1030;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:900;font-size:18px;">4</div>
    </div>
    <div class="result-line" style="margin-bottom:4px;">
      이렇게 계속 합쳐서 <b style="color:var(--ink);">2048 타일</b>을 만드는 게 목표예요.<br>
      보드가 꽉 차서 더 이상 못 밀면 게임 오버!
    </div>
    <button class="btn-retry" id="tutorialStartBtn">👍 알겠어요, 시작할게요</button>
  </div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="emoji" id="modalEmoji">🎉</div>
    <h2 id="modalTitle">2048 달성!</h2>
    <div class="result-line" id="modalLine">점수 0</div>
    <button class="btn-retry" id="retryBtn">새 게임 시작</button>
  </div>
</div>

<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '22px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const retryBtn = document.getElementById('retryBtn');
  const newGameBtn = document.getElementById('newGameBtn');

  const colors = {
    2:'#3a2a63', 4:'#4a3372', 8:'#FF6B4A', 16:'#ff8663',
    32:'#2DD4BF', 64:'#20b3a1', 128:'#FFC24B', 256:'#f0b13a',
    512:'#8B7CF6', 1024:'#7a67e0', 2048:'#22C55E', 4096:'#16A34A'
  };

  let grid, score, won, over, cellSize, gap;

  function loadBest(){ bestEl.textContent = localStorage.getItem('puzzle_best') || '0'; }

  function newGame(){
    grid = Array.from({length:SIZE}, ()=>Array(SIZE).fill(0));
    score = 0; won = false; over = false;
    scoreEl.textContent = '0';
    overlay.classList.remove('show');
    addRandomTile(); addRandomTile();
    render();
  }

  function addRandomTile(){
    const empty = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(grid[r][c]===0) empty.push([r,c]);
    if(empty.length===0) return;
    const [r,c] = empty[Math.floor(Math.random()*empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function measure(){
    const rect = boardEl.getBoundingClientRect();
    if(rect.width > 0){ boardEl.style.height = rect.width + 'px'; }
    gap = 8;
    cellSize = (rect.width - gap*(SIZE+1)) / SIZE;
  }

  function render(){
    measure();
    boardEl.innerHTML = '';
    for(let i=0;i<SIZE*SIZE;i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      boardEl.appendChild(cell);
    }
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const v = grid[r][c];
        if(v===0) continue;
        const tile = document.createElement('div');
        tile.className = 'tile pop';
        tile.textContent = v;
        tile.style.width = cellSize + 'px';
        tile.style.height = cellSize + 'px';
        tile.style.left = (gap + c*(cellSize+gap)) + 'px';
        tile.style.top = (gap + r*(cellSize+gap)) + 'px';
        tile.style.background = colors[v] || '#22C55E';
        tile.style.color = v <= 4 ? 'var(--ink)' : '#1B1030';
        tile.style.fontSize = (v < 100 ? 26 : v < 1000 ? 22 : 17) + 'px';
        boardEl.appendChild(tile);
      }
    }
    scoreEl.textContent = score;
  }

  function slideLine(line){
    const filtered = line.filter(v => v !== 0);
    const merged = [];
    let gained = 0;
    for(let i=0;i<filtered.length;i++){
      if(filtered[i] === filtered[i+1]){
        const val = filtered[i]*2;
        merged.push(val);
        gained += val;
        if(val === 2048 && !won) won = true;
        i++;
      } else {
        merged.push(filtered[i]);
      }
    }
    while(merged.length < SIZE) merged.push(0);
    return { merged, gained };
  }

  function move(dir){
    if(over) return;
    let changed = false;
    let totalGain = 0;

    if(dir === 'left' || dir === 'right'){
      for(let r=0;r<SIZE;r++){
        let line = grid[r].slice();
        if(dir === 'right') line = line.reverse();
        const { merged, gained } = slideLine(line);
        totalGain += gained;
        const finalLine = dir === 'right' ? merged.slice().reverse() : merged;
        if(JSON.stringify(finalLine) !== JSON.stringify(grid[r])) changed = true;
        grid[r] = finalLine;
      }
    } else {
      for(let c=0;c<SIZE;c++){
        let line = [];
        for(let r=0;r<SIZE;r++) line.push(grid[r][c]);
        if(dir === 'down') line = line.reverse();
        const { merged, gained } = slideLine(line);
        totalGain += gained;
        const finalLine = dir === 'down' ? merged.slice().reverse() : merged;
        for(let r=0;r<SIZE;r++){
          if(grid[r][c] !== finalLine[r]) changed = true;
          grid[r][c] = finalLine[r];
        }
      }
    }

    if(changed){
      score += totalGain;
      if(totalGain > 0){ SFX.pop(); FX.popText('+' + totalGain, null, null, 'var(--teal)'); }
      addRandomTile();
      render();
      const best = parseInt(localStorage.getItem('puzzle_best') || '0', 10);
      if(score > best) localStorage.setItem('puzzle_best', score);
      loadBest();

      if(won){
        showResult(true);
      } else if(isGameOver()){
        over = true;
        showResult(false);
      }
    }
  }

  function isGameOver(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      if(grid[r][c] === 0) return false;
      if(c < SIZE-1 && grid[r][c] === grid[r][c+1]) return false;
      if(r < SIZE-1 && grid[r][c] === grid[r+1][c]) return false;
    }
    return true;
  }

  function showResult(isWin){
    if(isWin){ SFX.win(); FX.flash('rgba(255,194,75,0.32)'); FX.vibrate([35,30,70]); } else { SFX.lose(); FX.shake(); FX.vibrate([70,40,70]); }
    document.getElementById('modalEmoji').textContent = isWin ? '🎉' : '😵';
    document.getElementById('modalTitle').textContent = isWin ? '2048 달성!' : '더 이상 이동할 수 없어요';
    document.getElementById('modalLine').textContent = '점수 ' + score;
    overlay.classList.add('show');
  }

  // keyboard
  window.addEventListener('keydown', e => {
    const map = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down' };
    if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
  });

  // touch swipe
  let sx=0, sy=0;
  boardEl.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  boardEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if(Math.abs(dx) > Math.abs(dy)){
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, {passive:true});

  retryBtn.addEventListener('click', newGame);
  newGameBtn.addEventListener('click', newGame);
  window.addEventListener('resize', render);

  const tutorialOverlay = document.getElementById('tutorialOverlay');
  if(localStorage.getItem('puzzle2048_seen_tutorial')){
    tutorialOverlay.classList.remove('show');
  }
  document.getElementById('tutorialStartBtn').addEventListener('click', () => {
    SFX.click();
    tutorialOverlay.classList.remove('show');
    localStorage.setItem('puzzle2048_seen_tutorial', '1');
  });

  loadBest();
  newGame();
})();
</script>
