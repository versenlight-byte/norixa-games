<script>
(function(){
  const SFX = (function(){
    let ctx;
    function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
    function tone(freq, duration, type, gainVal, delay){
      try{
        delay = delay||0;
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(gainVal||0.15, t0+0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0+duration+0.02);
      }catch(e){}
    }
    return {
      click(){ tone(440, 0.06, 'square', 0.07); },
      correct(){ tone(660,0.09,'sine',0.11); tone(880,0.12,'sine',0.11,0.08); },
      wrong(){ tone(180,0.18,'sawtooth',0.11); },
      win(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.16,'sine',0.12,i*0.09)); },
      lose(){ tone(300,0.14,'sawtooth',0.11); tone(200,0.22,'sawtooth',0.11,0.12); },
      pop(){ tone(700,0.05,'triangle',0.08); }
    };
  })();

  const FX = (function(){
    function shake(){
      const el = document.querySelector('.wrap');
      if(!el) return;
      el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake');
    }
    function flash(color){
      const f = document.createElement('div');
      f.className = 'fx-flash-el';
      f.style.background = color || 'rgba(45,212,191,0.28)';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(), 280);
    }
    function vibrate(pattern){
      try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
    }
    function popText(text, x, y, color){
      const p = document.createElement('div');
      p.className = 'fx-pop';
      p.textContent = text;
      p.style.left = (x!=null ? x+'px' : '50%');
      p.style.top = (y!=null ? y+'px' : '45%');
      p.style.fontSize = '22px';
      p.style.color = color || 'var(--amber)';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 760);
    }
    return { shake, flash, vibrate, popText };
  })();

  const WORDS = ["사과","과일","기차","차표","표범","범인","인형","형제","제비","비누",
  "나비","비행기","기린","스키","키보드","마늘","보름달","달력","사자","자동차",
  "선물","물고기","기타","타조","조개","개미","미소","소나무","무지개","개구리",
  "리본","드럼","주스","스푼","돈까스","키위","위성","문어","어항","항구",
  "구두","두부","부엉이","이불","불꽃","꽃병","병아리","가방","방울","나무",
  "무릎","호랑이","이슬","슬리퍼","퍼즐","임금","금붕어","어머니","트럭","비빔밥",
  "밥상","상자","자전거","거미","미역","역사","사탕","탕수육","육개장","장미",
  "미술","기와","와플","플루트","트림","프린터","터널","널빤지","지우개","개나리",
  "더위","위인","인삼","삼각형","형광펜","펜치","치약","약국","국수","수박",
  "박수","수건","건물","물감","감자","자석","석유","유리","체조","조각",
  "각도","도토리","토마토","토끼","끼니","은행","행복","복숭아","보리","리어카",
  "카드","드레스","스웨터","키다리","이야기","기억","억지","지도","도장","장난감",
  "감기","기분","분수","수영장","장갑","갑옷","옷장","장화","화분","분필",
  "필통","통닭","닭장","장수","수달","기적","적금","금고","고구마","마차",
  "차창","창문","문구점","점심","심장","난로",
  "누나","누룽지","누드","니트","본보기","성격","성실","술래","아빠","아침",
  "아기","아저씨","울타리","울음","일기","일요일","일주일","즐거움","즐비","푼돈",
  "린스","럭비","럼주","연필","필기","기와집","집게","게임","각오","오리",
  "오이","이사","사슴","새우","우산","산타","어깨","깨소금","금메달","달팽이",
  "이빨","빨래","벨트","터미널","안개","사다리","더덕","덕분","통조림","부채",
  "채소","금방울","울릉도","도라지","이마","종이","신발","발가락","가락지","지구본",
  "건강","강아지","지렁이","비단","단추","추석","석탑","탑승","승리","소나기",
  "서점","점토","토란","리듬","가수","수영복","복도","도넛","미니카","카메라",
  "라디오","오징어","무궁화","화장품","품질","질투","투수","대나무","레몬","치킨",
  "가든","함박눈","눈사람","보름밤","밤하늘","방망이","도자기","배구공","공룡","왕관",
  "관광","광어","어린이","수제비","너구리","조약돌"];

  const dict = new Set(WORDS);
  const byFirst = {};
  WORDS.forEach(w => {
    const f = w[0];
    (byFirst[f] = byFirst[f] || []).push(w);
  });

  // 두음법칙(頭音法則): ㄹ/ㄴ으로 시작하는 한자어는 단어 첫머리에서 ㅇ 또는 ㄴ으로 바뀌어요.
  // 예: 력→역, 로→노, 량→양. 이 변환을 인정해서 "력"으로 끝나도 "역"으로 시작하는 단어를 받아줘요.
  const Y_MEDIALS = new Set([2,3,6,7,12,17,20]); // ㅑㅒㅕㅖㅛㅠㅣ
  function decomposeHangul(ch){
    const code = ch.charCodeAt(0) - 0xAC00;
    if(code < 0 || code > 11171) return null;
    const jong = code % 28;
    const jung = ((code - jong) / 28) % 21;
    const cho = (((code - jong) / 28) - jung) / 21;
    return { cho, jung, jong };
  }
  function composeHangul(cho, jung, jong){
    return String.fromCharCode(0xAC00 + (cho*21 + jung)*28 + jong);
  }
  function ineumVariant(ch){
    const d = decomposeHangul(ch);
    if(!d) return null;
    if(d.cho === 5){ // ㄹ
      const newCho = Y_MEDIALS.has(d.jung) ? 11 : 2; // ㅇ or ㄴ
      return composeHangul(newCho, d.jung, d.jong);
    }
    if(d.cho === 2 && Y_MEDIALS.has(d.jung)){ // ㄴ + y모음
      return composeHangul(11, d.jung, d.jong);
    }
    return null;
  }
  function acceptableStarts(ch){
    const v = ineumVariant(ch);
    return v ? [ch, v] : [ch];
  }
  function candidatesFor(ch, usedSet){
    const starts = acceptableStarts(ch);
    const list = [];
    starts.forEach(s => (byFirst[s] || []).forEach(w => { if(!usedSet.has(w)) list.push(w); }));
    return list;
  }
  function hasLiveContinuation(word, usedSet){
    const futureUsed = new Set(usedSet); futureUsed.add(word);
    return candidatesFor(word[word.length-1], futureUsed).length > 0;
  }

  const chat = document.getElementById('chat');
  const input = document.getElementById('wordInput');
  const submitBtn = document.getElementById('submitBtn');
  const giveUpBtn = document.getElementById('giveUpBtn');
  const timebar = document.getElementById('timebar');
  const statScore = document.getElementById('statScore');
  const statBest = document.getElementById('statBest');
  const overlay = document.getElementById('overlay');
  const retryBtn = document.getElementById('retryBtn');

  const TURN_SECONDS = 15;
  let used, lastWord, score, timeLeft, timerId, over;

  function loadBest(){ statBest.textContent = localStorage.getItem('wordchain_best') || '0'; }

  function addBubble(text, cls){
    const b = document.createElement('div');
    b.className = 'bubble ' + cls;
    b.textContent = text;
    chat.appendChild(b);
    chat.scrollTop = chat.scrollHeight;
  }

  function startTimer(){
    clearInterval(timerId);
    timeLeft = TURN_SECONDS;
    timebar.style.transform = 'scaleX(1)';
    timerId = setInterval(()=>{
      timeLeft--;
      timebar.style.transform = 'scaleX(' + Math.max(timeLeft,0)/TURN_SECONDS + ')';
      if(timeLeft <= 0){
        clearInterval(timerId);
        endGame(false, '시간 초과!');
      }
    }, 1000);
  }

  function newGame(){
    used = new Set();
    lastWord = null;
    score = 0;
    over = false;
    statScore.textContent = '0';
    chat.innerHTML = '';
    overlay.classList.remove('show');
    addBubble('아무 단어로나 시작해보세요!', 'sys');
    input.value = '';
    startTimer();
    setTimeout(()=> input.focus(), 200);
  }

  function endGame(won, reason){
    over = true;
    if(won){ SFX.win(); FX.flash('rgba(255,194,75,0.32)'); FX.vibrate([35,30,70]); } else { SFX.lose(); FX.shake(); FX.vibrate([70,40,70]); }
    clearInterval(timerId);
    const best = parseInt(localStorage.getItem('wordchain_best') || '0', 10);
    if(score > best) localStorage.setItem('wordchain_best', score);
    loadBest();
    document.getElementById('modalEmoji').textContent = won ? '🎉' : '⏰';
    document.getElementById('modalTitle').textContent = won ? 'AI가 항복했어요!' : reason;
    document.getElementById('modalScore').textContent = '점수 ' + score;
    overlay.classList.add('show');
  }

  function aiTurn(){
    const startChar = lastWord[lastWord.length-1];
    const candidates = candidatesFor(startChar, used);
    setTimeout(()=>{
      if(candidates.length === 0){
        addBubble('...더 이상 이어갈 단어가 없어요. 졌습니다!', 'sys');
        endGame(true);
        return;
      }
      // 플레이어를 막다른 골목으로 몰지 않도록, 이어갈 단어가 남는 후보를 우선으로 골라요.
      const safeCandidates = candidates.filter(w => hasLiveContinuation(w, used));
      const pool = safeCandidates.length > 0 ? safeCandidates : candidates;
      const word = pool[Math.floor(Math.random()*pool.length)];
      used.add(word);
      lastWord = word;
      addBubble(word, 'ai');
      startTimer();
    }, 600 + Math.random()*500);
  }

  function submit(){
    if(over) return;
    const w = input.value.trim();
    input.value = '';
    if(!w || w.length < 2){
      SFX.wrong(); FX.shake(); FX.vibrate(30);
      addBubble('2글자 이상 입력해주세요', 'sys');
      return;
    }
    if(!dict.has(w)){
      SFX.wrong(); FX.shake(); FX.vibrate(30);
      addBubble('사전에 없는 단어예요 (' + w + ')', 'sys');
      return;
    }
    if(used.has(w)){
      SFX.wrong(); FX.shake(); FX.vibrate(30);
      addBubble('이미 나온 단어예요', 'sys');
      return;
    }
    if(lastWord){
      const starts = acceptableStarts(lastWord[lastWord.length-1]);
      if(!starts.includes(w[0])){
        SFX.wrong(); FX.shake(); FX.vibrate(30);
        const hint = starts.length > 1 ? ('"' + starts.join('" 또는 "') + '"') : ('"' + starts[0] + '"');
        addBubble(hint + '로 시작하는 단어여야 해요', 'sys');
        return;
      }
    }
    used.add(w);
    lastWord = w;
    score++;
    statScore.textContent = score;
    SFX.correct(); FX.flash('rgba(45,212,191,0.22)'); FX.vibrate(14);
    addBubble(w, 'me');
    clearInterval(timerId);
    aiTurn();
  }

  submitBtn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
  giveUpBtn.addEventListener('click', ()=> endGame(false, '게임 종료'));
  retryBtn.addEventListener('click', newGame);

  loadBest();
  newGame();
})();
</script>
</body>
</html>
